<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>RateruPAD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: RateruPAD。上端に赤の帯（墨色の太線で締める）、左に明るいサイドメニュー、右に業務画面。
   色は「赤 × 墨、文字は白」でまとめる。見やすさ優先で、端末が暗い表示でも常に白ベース（GRの青・黒は使わない） */
:root{
  color-scheme:light;
  --bg:#f4f5f2; --panel:#ffffff; --panel2:#f6f7f4; --text:#1c2530; --muted:#4a5561; --line:#cfd4cc; --hover:#f3f5ef;
  --dark:#1c2530; --dark2:#e5e8e1; --side-text:#1c2530; --side-muted:#5d6873; --side-bg:#f6f7f4;
  --band:#d7261e; --band-ink:#1c2530; --band-text:#ffffff;
  --accent:#1c2530; --accent-soft:#fde3e0; --accent-line:#ef9a92; --on-accent:#ffffff;
  --ok:#25744d; --ok-bg:#e6f7ef; --warn:#925900; --warn-bg:#fff0d9; --ng:#a83f36; --ng-bg:#fff0ef;
  --violet:#6846a6; --violet-bg:#f0eaff; --grey:#53606b; --grey-bg:#edf0f2;
  --alert-bg:#fff9ee; --alert-line:#f0d6a7; --bar:#fbd9d5; --bar2:#ef8a80; --bar3:#cdebdc;
  --rp-cu-bg:#e6dcf5; --rp-cu:#4f2f86; --rp-fix-bg:#1f3f8a; --rp-fix:#ffffff; --rp-on-bg:#d9368f; --rp-on:#ffffff;
  --rp-done-bg:#f7e04a; --rp-done:#3d3400; --rp-can-bg:#7b7f85; --rp-can:#ffffff; --rp-sec:#d7261e; --rp-sec-ink:#ffffff; --rp-grp-bg:#1c2530; --rp-grp:#ffffff;
  --shadow:0 2px 8px rgba(16,24,40,.04); --overlay:rgba(0,0,0,.32);
  --radius:14px;
  --font:"BIZ UDPGothic",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  --disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3,h4{text-wrap:balance}
small{color:var(--muted)}
.num,td,.count{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--side-bg);color:var(--text);border-right:1px solid var(--line);padding:0 14px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{background:var(--band);color:var(--band-text);margin:0 -14px 14px;padding:12px 26px 10px;border-bottom:3px solid var(--band-ink);min-height:67px}
.brand h1{font-family:var(--disp);font-weight:900;font-size:25px;line-height:1.05;letter-spacing:.02em;margin:0;color:var(--band-text)}
.brand small{color:var(--band-text);font-weight:700;font-size:10px;letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;border:0;background:transparent;color:var(--side-text);text-align:left;padding:11px 12px;font-size:15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--dark2);color:var(--text)}
.nav button.active{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:999px}
.nav .badge{background:var(--band);color:var(--band-text);font-weight:700;border-radius:999px;padding:0 7px;font-size:11px;line-height:18px}
.sidebar-foot{margin-top:8px;font-size:12px;color:var(--side-muted);padding:0 12px}
.main{min-width:0}
.topbar{min-height:67px;background:var(--band);color:var(--band-text);border-bottom:3px solid var(--band-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .left,.topbar .right{display:flex;gap:10px;align-items:center;min-width:0}
.project-name{font-weight:700}
.rolesel{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;font-size:12px;max-width:190px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bell{position:relative}
.bell .dotn{position:absolute;top:-5px;right:-5px;background:var(--ng);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
.mobile-only{display:none}
.content{padding:24px;max-width:1500px;margin:0 auto}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap}
.hero h2{margin:0 0 4px;font-size:26px;font-family:var(--disp);font-weight:900;letter-spacing:.02em}
.topbar .btn,.topbar .rolesel{background:transparent;color:var(--band-text);border:2px solid var(--band-text);font-weight:700}
.topbar .btn:hover{background:var(--band-text);color:var(--band)}
.topbar .rolesel option{background:var(--panel);color:var(--text)}
.top-brand{font-family:var(--disp);font-weight:900;font-size:21px;letter-spacing:.02em}
.top-sub{font-size:12px;font-weight:700;letter-spacing:.1em}
.hero p{margin:0;color:var(--muted)}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.kpi{padding:14px 16px;text-align:left;border:1px solid var(--line)}
button.kpi{cursor:pointer;width:100%}
button.kpi:hover{border-color:var(--accent-line)}
.kpi .label{font-size:13px;color:var(--muted);font-weight:700}
.kpi .num{font-size:26px;font-weight:800;margin-top:2px}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpis.money{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi.money{min-width:0}.kpi.money .num{font-size:clamp(19px,1.7vw,24px);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.section{padding:18px}
.section h3{margin:0 0 12px;font-size:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px}
select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
th{color:var(--muted);font-weight:600;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--hover)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.status{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.s-survey{background:var(--warn-bg);color:var(--warn)}
.s-estimate{background:var(--accent-soft);color:var(--accent)}
.s-approve{background:var(--violet-bg);color:var(--violet)}
.s-build{background:var(--ok-bg);color:var(--ok)}
.s-check{background:var(--ng-bg);color:var(--ng)}
.s-done{background:var(--grey-bg);color:var(--grey)}
.progress{height:7px;background:var(--grey-bg);border-radius:999px;overflow:hidden;width:110px}
.progress span{display:block;height:100%;background:var(--accent)}
.timeline{display:flex;flex-direction:column;gap:10px}
.tl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.tl b{font-size:13px}
.tl small{display:block}
.alert{padding:11px 12px;border:1px solid var(--alert-line);background:var(--alert-bg);border-radius:12px;margin:0 0 8px;font-size:13px;cursor:pointer;display:block;width:100%;text-align:left}
.alert.ng{border-color:var(--ng);background:var(--ng-bg)}
.project-header{padding:18px;margin-bottom:16px}
.project-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{border:0;background:transparent;padding:12px 12px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tabcontent{padding:18px}
.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;background:var(--panel)}
.check .title{font-weight:700;font-size:13px}
.check .desc{color:var(--muted);font-size:12px;margin-top:2px}
.check textarea,.check input{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;background:var(--panel2)}
.pill{font-size:11px;border-radius:999px;padding:3px 9px;height:fit-content;white-space:nowrap;border:0;font-weight:700}
button.pill{cursor:pointer}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.ng{background:var(--ng-bg);color:var(--ng)}
.pill.todo{background:var(--grey-bg);color:var(--grey)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.file .type{font-size:11px;color:var(--muted);font-family:var(--mono)}
.file b{font-size:13px}
.file .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gantt-wrap{overflow-x:auto}
/* 案件進捗（RateruPAD）：案件進捗シートの色をそのまま使う */
.rp-st{display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.rp-pre{background:var(--grey-bg);color:var(--grey)} .rp-nr{background:var(--ng-bg);color:var(--ng)} .rp-apo{background:var(--accent-soft);color:var(--accent)}
.rp-mk{background:var(--warn-bg);color:var(--warn)} .rp-in{background:var(--violet-bg);color:var(--violet)} .rp-cu{background:var(--rp-cu-bg);color:var(--rp-cu)}
.rp-adj{background:var(--ok-bg);color:var(--ok)} .rp-fix{background:var(--rp-fix-bg);color:var(--rp-fix)} .rp-on{background:var(--rp-on-bg);color:var(--rp-on)}
.rp-done{background:var(--rp-done-bg);color:var(--rp-done)} .rp-can{background:var(--rp-can-bg);color:var(--rp-can)}
.rp-table{min-width:1250px} .rp-table td{vertical-align:top}
.rp-table tr.sec td{background:var(--rp-sec);color:var(--rp-sec-ink);font-weight:800;letter-spacing:.06em}
.rp-table tr.grp td{background:var(--rp-grp-bg);color:var(--rp-grp);font-weight:700;padding:6px 10px}
.rp-yn{display:inline-block;min-width:26px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.rp-yn.on{background:var(--rp-done-bg);color:var(--rp-done);border-color:transparent} .rp-yn.warn{color:var(--ng);border-color:var(--ng)}
.rp-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.rp-col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rp-col h4{margin:0;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.rp-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 9px;cursor:pointer;display:grid;gap:3px;font-size:12px}
.rp-card:hover{border-color:var(--accent-line)} .rp-card b{font-size:13px}
.rp-card .mv{display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.rp-flow{font-size:12px;color:var(--muted);margin:0 0 10px}
.grid-side{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:16px;align-items:start}
.month-list{display:flex;flex-direction:column;gap:2px}
.month-list button{display:flex;justify-content:space-between;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left;font-size:15px}
.month-list button:hover{background:var(--hover)} .month-list button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.month-list button.on .muted{color:var(--on-accent)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tpl{padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:88px}
.tpl:hover{border-color:var(--accent-line)} .tpl b{font-size:16px}
.rel{display:flex;flex-direction:column;padding:6px 0;border-top:1px dashed var(--line)} .rel .linkbtn{font-size:14px;text-align:left;font-weight:700}
.linkbtn{text-decoration:underline;text-underline-offset:2px}
.ybar{height:7px;background:var(--grey-bg);border-radius:99px;overflow:hidden;margin:2px 0}
.ybar span{display:block;height:100%} .ybar .s{background:var(--band)} .ybar .b{background:var(--grey)}
.year-table tr.on td{background:var(--accent-soft);font-weight:700}
@media(max-width:760px){.grid-side{grid-template-columns:minmax(0,1fr)} .month-list{flex-direction:row;overflow-x:auto} .month-list button{white-space:nowrap}}
.cal .ev.pipe{background:var(--rp-fix-bg);color:var(--rp-fix)}
.ev.plan{background:color-mix(in srgb,var(--pc) 13%,#fff)!important;color:var(--pc)!important;box-shadow:inset 3px 0 0 var(--pc);font-weight:700}
.soon{position:relative;border:2px dashed var(--line);padding:22px}
.soon-badge{display:inline-block;background:var(--band);color:var(--band-text);font-weight:800;padding:4px 14px;border-radius:999px;margin-bottom:8px;letter-spacing:.1em}
.soon ul{margin:8px 0 0;padding-left:1.3em;line-height:2}
.who-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.who{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;cursor:pointer;min-height:40px}
.who i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.who.on{background:var(--band-ink);border-color:var(--band-ink);color:#fff}
.who.on i{box-shadow:0 0 0 2px #fff}
.who-title{color:var(--pc);font-size:.9em}
.cal .dn{border:0;background:none;padding:0 4px;font:inherit;font-weight:700;color:inherit;cursor:pointer;border-radius:4px}.cal .dn:hover{background:var(--panel2)}
.agenda{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.agenda.today .ad{color:var(--band)}
.agenda .ad{width:40px;flex:none;text-align:center;font-size:20px;font-weight:800;line-height:1.1}.agenda .ad small{display:block;font-size:12px;color:var(--muted)}
.agenda .al{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.agenda .ev{display:block;text-align:left;border:0;border-radius:6px;padding:6px 10px;font-size:14px;background:var(--bar);color:var(--text);cursor:pointer}
.agenda .ev.pipe{background:var(--rp-fix-bg);color:var(--rp-fix)}
.gantt{display:grid;gap:4px 2px;align-items:center;font-size:11px}
.gantt .hd{color:var(--muted);font-weight:700;text-align:center;padding-bottom:4px}
.gantt .hd.we{color:var(--ng)}
.gantt .hd.today{color:var(--accent)}
.gantt .lbl{font-size:12px;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gantt .bar{height:22px;border-radius:6px;background:var(--bar);cursor:pointer;display:flex;align-items:center;padding:0 6px;font-size:10px;color:var(--text);overflow:hidden;white-space:nowrap}
.gantt .bar.done{background:var(--bar3)}
.gantt .bar.late{background:var(--ng-bg);color:var(--ng);outline:1px solid var(--ng)}
.gantt .bar.active{background:var(--bar2)}
.chat{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.messages{height:420px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin:8px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;background:var(--accent-soft);border-color:var(--accent-line)}
.msg small{display:block;margin-bottom:2px}
.compose{display:flex;gap:8px;margin-top:10px}
.compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.approval{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.approval .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.approval .body{font-size:12px;color:var(--muted);margin:6px 0}
.approval .actions{display:flex;gap:8px;flex-wrap:wrap}
.approval .hist{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.inspection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.inspect{padding:14px}
.inspect h4{margin:0 0 6px}
.inspect .count{font-size:26px;font-weight:800}
.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.photo{aspect-ratio:4/3;max-width:100%;background:var(--grey-bg);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photo span{position:absolute;left:6px;bottom:6px;background:var(--panel);opacity:.92;padding:2px 6px;border-radius:6px;color:var(--text);font-size:11px}
.photo .x{position:absolute;right:6px;top:6px;border:0;background:var(--panel);border-radius:6px;font-size:11px;padding:2px 6px}
label.photo{cursor:pointer;border-style:dashed}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--text);font-weight:700}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel)}
.field textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawer{position:fixed;right:0;top:0;width:440px;max-width:100%;height:100%;background:var(--panel);box-shadow:-10px 0 30px rgba(0,0,0,.18);z-index:30;transform:translateX(105%);transition:transform .22s;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));overflow:auto}
.drawer.open{transform:none}
.drawer h2{margin:0;font-size:20px}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:29}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:var(--overlay);padding:16px}
.modal .box{background:var(--panel);border-radius:14px;padding:18px;max-width:420px;width:100%}
.modal .box.wide{max-width:900px}
.modal img{max-width:100%;max-height:78vh;display:block;margin:0 auto;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-text);font-weight:700;padding:10px 16px;border-radius:10px;z-index:50;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.board-opt{margin:-2px 0 10px;gap:10px}.input-sm{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--panel);color:var(--text);min-width:200px}

let S;
function load(){ let d=null; try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const j=JSON.parse(raw.replace(/令和さん/g,'元請').replace(/令和/g,'元請'));   /* 以前のお試しデータの表記を合わせる */ if(j&&j.version===2) d=j; } }catch(e){} d=d||seed(); ['reports','notices','todos','internal','pipeline','meetings','templates','sales'].forEach(k=>d[k]=d[k]||[]); if(!d.plans) d.plans=planSeed(); return d; }
function save(){ if(MODE==='server'){ Sync.schedule(); return; } try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ toast('この端末に保存できませんでした（ブラウザの保存領域を確認してください）'); } }
const FileStore = (() => {
  let dbp = null; const mem = new Map();
  function db(){ if(dbp) return dbp; dbp = new Promise((res)=>{ try{ const r=indexedDB.open('reiwa-gr-hub-files',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); return dbp; }
  async function put(key, blob){ mem.set(key, blob); if(MODE==='server') return Remote.put(key, blob); const d=await db(); if(!d) return; await new Promise(r=>{ try{ const tx=d.transaction('files','readwrite'); tx.objectStore('files').put(blob,key); tx.oncomplete=r; tx.onerror=r; }catch(e){ r(); } }); }
  async function get(key){ if(mem.has(key)) return mem.get(key); if(MODE==='server'){ const b=await Remote.get(key); if(b) mem.set(key,b); return b; } const d=await db(); if(!d) return null; return new Promise(r=>{ try{ const q=d.transaction('files').objectStore('files').get(key); q.onsuccess=()=>{ if(q.result) mem.set(key,q.result); r(q.result||null); }; q.onerror=()=>r(null); }catch(e){ r(null); } }); }
  async function del(key){ mem.delete(key); if(MODE==='server') return Remote.del(key); const d=await db(); if(!d) return; try{ d.transaction('files','readwrite').objectStore('files').delete(key); }catch(e){} }
  async function clear(){ mem.clear(); const d=await db(); if(!d) return; try{ d.transaction('files','readwrite').objectStore('files').clear(); }catch(e){} }
  return {put,get,del,clear};
})();
const urlCache = new Map();
async function fileURL(key){ if(urlCache.has(key)) return urlCache.get(key); const b=await FileStore.get(key); if(!b) return null; const u=URL.createObjectURL(b); urlCache.set(key,u); return u; }
// 現場写真は長辺1600pxに縮小して保存容量を抑える
function shrinkImage(file, max=1600){
  return new Promise(res=>{
    if(!file.type.startsWith('image/')) return res(file);
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); if(r===1){URL.revokeObjectURL(u);return res(file);} const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>res(b||file),'image/jpeg',0.85); };
    img.onerror=()=>{URL.revokeObjectURL(u);res(file);};
    img.src=u;
  });
}

/* ============ 電子小黒板（写真の左下に工事名・工種・撮影日などを焼き込む） ============ */
function boardRows(pid, folder, shotAt, note){
  const p=proj(pid)||{}, [trade,phase]=String(folder).split('/');
  return [['工事名',p.name||''],['案件番号',pid],['工種',phase?`${trade}（${phase}）`:trade],['撮影日',new Date(shotAt).toLocaleDateString('ja-JP')],['施工者',myLabel()],...(note?[['備考',note]]:[])];
}
function burnBoard(blob, rows){
  return new Promise(res=>{
    const u=URL.createObjectURL(blob), img=new Image();
    img.onload=()=>{
      const W=img.naturalWidth, H=img.naturalHeight, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); g.drawImage(img,0,0);
      const bw=Math.round(Math.min(W*0.46, H*0.6)), rh=Math.round(bw*0.1), bh=rh*rows.length, m=Math.round(bw*0.03), x=m, y=H-bh-m, lw=Math.round(bw*0.27), fs=Math.round(rh*0.46), lt=Math.max(1,Math.round(bw/260));
      g.fillStyle='#1f4d33'; g.fillRect(x,y,bw,bh);
      g.strokeStyle='#fff'; g.lineWidth=lt; g.strokeRect(x+lt/2,y+lt/2,bw-lt,bh-lt);
      g.beginPath(); g.moveTo(x+lw,y); g.lineTo(x+lw,y+bh); for(let i=1;i<rows.length;i++){ g.moveTo(x,y+rh*i); g.lineTo(x+bw,y+rh*i); } g.stroke();
      g.fillStyle='#fff'; g.textBaseline='middle'; g.font=`bold ${fs}px "Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif`;
      const fit=(t,w)=>{ t=String(t); if(g.measureText(t).width<=w) return t; while(t.length>1 && g.measureText(t+'…').width>w) t=t.slice(0,-1); return t+'…'; };
      rows.forEach(([k,v],i)=>{ const cy=y+rh*i+rh/2; g.textAlign='center'; g.fillText(k, x+lw/2, cy); g.textAlign='left'; g.fillText(fit(v, bw-lw-fs), x+lw+fs/2, cy); });
      URL.revokeObjectURL(u); c.toBlob(b=>res(b||blob),'image/jpeg',0.88);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); res(blob); };
    img.src=u;
  });
}

const OFFICE_KIND = {meeting:'meetings',template:'templates',sale:'sales',plan:'plans'};   // 会議資料・書類ひな形・売上（Rateruだけ）
const RECORD_KIND = {todo:'todos',report:'reports',notice:'notices',task:'tasks',estimate:'estimates',doc:'docs',photo:'photos',correction:'corrections',approval:'approvals',message:'messages',activity:'activity',change:'changes'};
const Sync = {
  synced:{projects:new Map(), records:new Map(), internal_records:new Map()},
  timer:null, busy:false, again:false,
  // 画面の状態 S → テーブルの行
  rows(){
    const ids=new Set(S.projects.map(p=>p.id));
    const out={projects:S.projects.map(p=>({id:p.id,data:p})), records:[], internal_records:[]};
    for(const [pid,v] of Object.entries(S.surveys)) if(ids.has(pid)) out.records.push({id:'survey:'+pid,project_id:pid,kind:'survey',data:v});
    for(const [pid,v] of Object.entries(S.inspections)) if(ids.has(pid)) out.records.push({id:'inspection:'+pid,project_id:pid,kind:'inspection',data:v});
    for(const [kind,key] of Object.entries(RECORD_KIND)) for(const x of S[key]){
      if(!x.id) x.id=uid(kind.slice(0,2));
      if(!ids.has(x.pid)) continue;
      const data = kind==='estimate' ? {...x, cost:undefined} : x;   // 原価は元請から見える行に入れない
      out.records.push({id:x.id,project_id:x.pid,kind,data});
    }
    if(me().role==='gr_admin'){
      for(const e of S.estimates) if(ids.has(e.pid)) out.internal_records.push({id:'cost:'+e.id,project_id:e.pid,kind:'estimate_cost',data:{estimateId:e.id,cost:e.cost||0}});
      for(const x of S.internal) out.internal_records.push({id:x.id,project_id:ids.has(x.pid)?x.pid:null,kind:x.kind,data:x});
      for(const x of (S.pipeline||[])) out.internal_records.push({id:x.id,project_id:ids.has(x.pid)?x.pid:null,kind:'pipeline',data:x});   // 案件進捗はRateruだけ
      for(const [kind,key] of [['meeting','meetings'],['template','templates'],['sale','sales'],['plan','plans']]) for(const x of (S[key]||[])) out.internal_records.push({id:x.id,project_id:null,kind,data:x});
    }
    return out;
  },
  schedule(){ clearTimeout(this.timer); this.timer=setTimeout(()=>{ this.timer=null; this.flush(); }, 350); },
  async flush(){
    if(this.busy){ this.again=true; return; }
    this.busy=true; let failed=null;
    try{
      const cur=this.rows(), order=['projects','records','internal_records'], seen={};
      for(const t of order){
        const m=this.synced[t], up=[]; seen[t]=new Set();
        for(const r of cur[t]){ const j=JSON.stringify(r); seen[t].add(r.id); if(m.get(r.id)!==j) up.push([r,j]); }
        for(let i=0;i<up.length;i+=200){ const chunk=up.slice(i,i+200); const {error}=await SB.from(t).upsert(chunk.map(x=>x[0])); if(error) failed=error; else chunk.forEach(([r,j])=>m.set(r.id,j)); }
      }
      for(const t of [...order].reverse()){
        if(t==='internal_records' && me().role!=='gr_admin') continue;
        const m=this.synced[t], gone=[...m.keys()].filter(id=>!seen[t].has(id));
        if(gone.length){ const {error}=await SB.from(t).delete().in('id',gone); if(error) failed=error; else gone.forEach(id=>m.delete(id)); }
      }
    }catch(e){ failed=e; }
    this.busy=false;
    if(failed){ toast('保存できなかった変更があります（権限がないか通信エラー）。最新の状態に戻しました'); await this.pull(); return; }
    if(this.again){ this.again=false; this.flush(); }
  },
  async fetchAll(t){
    const all=[]; for(let from=0;;from+=1000){ const {data,error}=await SB.from(t).select('id,project_id,kind,data'.replace(t==='projects'?',project_id,kind':'','')).range(from,from+999); if(error) throw error; all.push(...data); if(data.length<1000) break; } return all;
  },
  // サーバー → 画面の状態 S
  async pull(){
    try{
      const [P,R,I]=await Promise.all([this.fetchAll('projects'), this.fetchAll('records'), me().role==='gr_admin'?this.fetchAll('internal_records'):Promise.resolve([])]);
      const st=emptyState(), cost={};
      st.projects=P.map(r=>r.data).sort((a,b)=>b.id.localeCompare(a.id));
      for(const r of R){
        if(r.kind==='survey') st.surveys[r.project_id]=r.data;
        else if(r.kind==='inspection') st.inspections[r.project_id]=r.data;
        else if(RECORD_KIND[r.kind]) st[RECORD_KIND[r.kind]].push(r.data);
      }
      for(const r of I){ if(r.kind==='estimate_cost') cost[r.data.estimateId]=r.data.cost; else if(r.kind==='pipeline') st.pipeline.push(r.data); else if(OFFICE_KIND[r.kind]) st[OFFICE_KIND[r.kind]].push(r.data); else st.internal.push(r.data); }
      st.estimates.forEach(e=>{ e.cost = cost[e.id]; });
      const byAtDesc=(a,b)=>(b.at||'').localeCompare(a.at||'');
      st.activity.sort(byAtDesc); st.changes.sort(byAtDesc); st.internal.sort(byAtDesc); st.notices.sort(byAtDesc); st.reports.sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at));
      st.messages.sort((a,b)=>a.at.localeCompare(b.at));
      st.approvals.sort((a,b)=>(b.history[0]?.at||'').localeCompare(a.history[0]?.at||''));
      S=st;
      const cur=this.rows();
      for(const t of Object.keys(this.synced)){ this.synced[t]=new Map(cur[t].map(r=>[r.id,JSON.stringify(r)])); }
      render();
    }catch(e){ toast('サーバーからデータを読み込めませんでした：'+(e.message||e)); }
  }
};

async function openBlob(key, name){
  const b=await FileStore.get(key); if(!b){ toast('ファイルが見つかりません'); return; }
  const u=await fileURL(key);
  if(b.type.startsWith('image/')) $('#modalRoot').innerHTML=`<div class="modal" data-act="closeModal"><div class="box wide"><img src="${u}" alt="${esc(name)}"><p class="muted">${esc(name)}</p></div></div>`;
  else await saveFile(b, name, u);
}
// ファイルを端末に保存する。claude.ai のプレビューの中では、そこの保存機能（iPhoneアプリでは共有メニュー）を使う
async function saveFile(b, name, u){
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){
    try{ await dl.save({filename:name, data:b}); }
    catch(e){ if(e?.code==='rejected_extension'||e?.code==='extension_not_enabled') toast('この形式のファイルはプレビューでは保存できません（PDF・Excel・Word・画像はできます）'); else if(e?.code!=='declined') toast('保存できませんでした'); }
    return;
  }
  const a=document.createElement('a'); a.href=u||URL.createObjectURL(b); a.download=name; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();
}

/* ============ 図面ビューア（PDF・画像を開いて、印・メモ・手書きを書き込む） ============
   書き込みは資料の marks に 0〜1 の比率で保存するので、拡大率や端末が違っても同じ位置に出る。
   新しい版を登録すると、それまでの書き込みは旧版の履歴側に移る。 */
const PDFJS_VER='3.11.174';
let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsP) return pdfjsP;
  const base = window.HUB_CONFIG ? '' : `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/`;   // サーバー版は同じ場所に置いた部品を使う
  pdfjsP = new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=base+'pdf.min.js';
    s.onload=()=>{ const L=window.pdfjsLib; if(!L) return ng(new Error('pdfjs')); L.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; ok(L); };
    s.onerror=()=>{ pdfjsP=null; s.remove(); ng(new Error('pdfjs')); }; document.head.appendChild(s); });
  return pdfjsP;
}
const MARK_COLORS=[['#e11d48','赤'],['#2563eb','青'],['#16a34a','緑'],['#111827','黒']];
const V={id:null};
const vDoc = () => S.docs.find(x=>x.id===V.id);

const isViewable = d => /\.(pdf|png|jpe?g|gif|webp|bmp)$/i.test(d.fileName||'');
async function openViewer(doc){
  const b=await FileStore.get(doc.fileKey); if(!b){ toast('ファイルが見つかりません'); return; }
  const isPdf = b.type==='application/pdf' || /\.pdf$/i.test(doc.fileName||'');
  if(!isPdf && !b.type.startsWith('image/') && !isViewable(doc)) return openBlob(doc.fileKey, doc.fileName||doc.name);
  Object.assign(V,{id:doc.id, pdf:null, img:null, page:1, pages:1, zoom:1, W:0, H:0, tool:'move', color:MARK_COLORS[0][0], sel:null, drawing:null, changed:false, task:null, gen:(V.gen||0)+1});
  $('#modalRoot').innerHTML=`<div class="viewer" id="viewer" data-tool="move" role="dialog" aria-label="${esc(doc.name)}">
    <div class="vbar" id="vBar"></div>
    <div class="vmain"><div class="vscroll" id="vScroll"><div class="vmsg" id="vMsg">図面を読み込んでいます…</div><div class="vstage" id="vStage" hidden><canvas id="vCanvas"></canvas><svg id="vSvg" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
    <aside class="vside" id="vSide"></aside></div></div>`;
  document.body.classList.add('noscroll'); vBind(); vBar(); vSide();
  const gen=V.gen;
  try{
    if(isPdf){ const L=await loadPdfJs(); V.pdf=await L.getDocument({data:new Uint8Array(await b.arrayBuffer())}).promise; V.pages=V.pdf.numPages; }
    else V.img=await new Promise((ok,ng)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ng; i.src=URL.createObjectURL(b); });
  }catch(e){ if(gen===V.gen) $('#vMsg').innerHTML='この図面を表示できませんでした。通信状況を確認してもう一度開いてください。<br><br><button class="btn" data-v="download">ファイルとして開く</button>'; return; }
  if(gen!==V.gen) return;
  $('#vMsg').hidden=true; $('#vStage').hidden=false;
  await vPage(1);
}
function closeViewer(){
  const doc=vDoc(); if(doc && V.changed){ log(doc.pid,`図面に書き込み / ${doc.name}`); save(); }
  if(V.task) try{ V.task.cancel(); }catch(e){}
  if(V.pdf) try{ V.pdf.destroy(); }catch(e){}
  V.id=null; V.gen++; $('#modalRoot').innerHTML=''; document.body.classList.remove('noscroll'); render();
}
async function vPage(n){
  n=Math.max(1,Math.min(V.pages,n)); V.page=n; V.sel=null;
  if(V.pdf){ const pg=await V.pdf.getPage(n); const vp=pg.getViewport({scale:1}); V.pg=pg; V.W=vp.width; V.H=vp.height; }
  else { V.W=V.img.naturalWidth; V.H=V.img.naturalHeight; }
  vFit(); vBar(); vSide();
}
function vFit(){ const sc=$('#vScroll'); if(!sc||!V.W) return; vZoom(Math.min((sc.clientWidth-32)/V.W,(sc.clientHeight-32)/V.H)); sc.scrollTo(0,0); }
function vZoom(z, cx, cy){
  const sc=$('#vScroll'), st=$('#vStage'); if(!sc||!st||!V.W) return;
  z=Math.max(0.1,Math.min(8,z)); const old=V.zoom;
  if(cx==null){ cx=sc.clientWidth/2; cy=sc.clientHeight/2; }
  const px=(sc.scrollLeft+cx-st.offsetLeft)/old, py=(sc.scrollTop+cy-st.offsetTop)/old;
  V.zoom=z; st.style.width=Math.round(V.W*z)+'px'; st.style.height=Math.round(V.H*z)+'px';
  sc.scrollLeft=px*z+st.offsetLeft-cx; sc.scrollTop=py*z+st.offsetTop-cy;
  vMarks(); vBar(); clearTimeout(V.drawT); V.drawT=setTimeout(vDraw,120);
}
async function vDraw(){
  const cv=$('#vCanvas'); if(!cv||!V.W) return;
  const dpr=window.devicePixelRatio||1, maxPx=4096*4096;
  let s=V.zoom*dpr; if(V.W*s*V.H*s>maxPx) s=Math.sqrt(maxPx/(V.W*V.H));   // 大きすぎる図面は画質を少し落として描く
  const w=Math.round(V.W*s), h=Math.round(V.H*s);
  if(V.task){ try{ V.task.cancel(); }catch(e){} V.task=null; }
  if(V.pdf){
    const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
    const task=V.pg.render({canvasContext:tmp.getContext('2d'), viewport:V.pg.getViewport({scale:s})}); V.task=task;
    try{ await task.promise; }catch(e){ return; }
    if(V.task!==task) return; V.task=null;
    cv.width=w; cv.height=h; cv.getContext('2d').drawImage(tmp,0,0);
  } else { cv.width=w; cv.height=h; const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,w,h); c.drawImage(V.img,0,0,w,h); }
}
const vPageMarks = () => ((vDoc()||{}).marks||[]).filter(m=>(m.page||1)===V.page);
function vMarks(){

function vSide(){

function vPoint(e){ const r=$('#vSvg').getBoundingClientRect(); return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)), Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]; }

    const b=e.target.closest('[data-v]'); if(!b) return; const a=b.dataset.v, doc=vDoc();
    if(a==='close') return closeViewer();
    if(a==='download'){ if(!doc) return; const u=await fileURL(doc.fileKey); if(!u) return; const l=document.createElement('a'); l.href=u; l.download=doc.fileName||doc.name; l.target='_blank'; document.body.appendChild(l); l.click(); l.remove(); return; }
    if(a==='prev') return vPage(V.page-1);
    if(a==='next') return vPage(V.page+1);
    if(a==='zin') return vZoom(V.zoom*1.25);
    if(a==='zout') return vZoom(V.zoom/1.25);
    if(a==='fit') return vFit();
    if(a==='tool'){ V.tool=b.dataset.tool; root.dataset.tool=V.tool; vBar(); vSide(); return; }
    if(a==='color'){ V.color=b.dataset.c; vBar(); return; }
    if(!doc) return;
    if(a==='undo'){ const mine=(doc.marks||[]).filter(m=>m.by===myLabel()&&(m.page||1)===V.page).pop(); if(!mine){ toast('取り消せる書き込みがありません'); return; } doc.marks=doc.marks.filter(m=>m!==mine); V.changed=true; save(); vMarks(); vSide(); return; }
    if(a==='delMark'){ doc.marks=(doc.marks||[]).filter(m=>m.id!==b.dataset.mid); V.changed=true; save(); vMarks(); vSide(); return; }
    if(a==='clearPen'){ doc.marks=(doc.marks||[]).filter(m=>!(m.t==='pen'&&(m.page||1)===V.page&&vMine(m))); V.changed=true; save(); vMarks(); vSide(); return; }
  });
  root.addEventListener('input', e=>{ const id=e.target.dataset.vnote; if(!id) return; const m=((vDoc()||{}).marks||[]).find(x=>x.id===id); if(!m) return; m.text=e.target.value; V.changed=true; clearTimeout(V.saveT); V.saveT=setTimeout(save,500); });
  root.addEventListener('focusin', e=>{ const id=e.target.dataset.vnote; if(id && V.sel!==id){ V.sel=id; vMarks(); root.querySelectorAll('.vnote').forEach(n=>n.classList.toggle('sel',n.dataset.vn===id)); } });
  // 図面の上での操作
  svg.addEventListener('pointerdown', e=>{
    if(e.button>0 || V.pinch) return;
    const pin=e.target.closest('.pin');
    if(V.tool==='pen'){ e.preventDefault(); svg.setPointerCapture(e.pointerId); V.drawing={pid:e.pointerId, pts:[vPoint(e)]}; vMarks(); return; }
    if(pin && V.tool!=='pen'){ e.preventDefault(); V.sel=pin.dataset.mid; vMarks(); vSide(); const n=$(`#vSide [data-vn="${V.sel}"]`); if(n) n.scrollIntoView({block:'nearest'}); return; }
    if(V.tool==='pin'){ e.preventDefault(); const [x,y]=vPoint(e); vAdd({t:'pin',x,y,text:''}); const doc=vDoc(); V.sel=doc.marks[doc.marks.length-1].id; vMarks(); vSide(); const t=$(`#vSide [data-vnote="${V.sel}"]`); if(t){ t.focus({preventScroll:true}); t.scrollIntoView({block:'nearest'}); } }
  });
  svg.addEventListener('pointermove', e=>{
    const d=V.drawing; if(!d || d.pid!==e.pointerId) return;
    const p=vPoint(e), q=d.pts[d.pts.length-1];
    if(Math.hypot((p[0]-q[0])*V.W*V.zoom,(p[1]-q[1])*V.H*V.zoom)<2) return;
    d.pts.push(p); const live=$('#vLive'); if(live) live.setAttribute('points', d.pts.map(p=>`${(p[0]*V.W).toFixed(1)},${(p[1]*V.H).toFixed(1)}`).join(' '));
  });
  const endPen=e=>{ const d=V.drawing; if(!d || d.pid!==e.pointerId) return; V.drawing=null;
    if(d.pts.length>1) vAdd({t:'pen',pts:d.pts.map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)])}); vMarks(); vSide(); };
  svg.addEventListener('pointerup', endPen); svg.addEventListener('pointercancel', e=>{ if(V.drawing&&V.drawing.pid===e.pointerId){ V.drawing=null; vMarks(); } });
  // 移動：マウスはドラッグでスクロール
  let drag=null;
  sc.addEventListener('pointerdown', e=>{ if(V.tool!=='move'||e.pointerType!=='mouse'||e.button!==0||e.target.closest('.pin')) return; drag={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop}; sc.setPointerCapture(e.pointerId); sc.style.cursor='grabbing'; });
  sc.addEventListener('pointermove', e=>{ if(!drag) return; sc.scrollLeft=drag.l-(e.clientX-drag.x); sc.scrollTop=drag.t-(e.clientY-drag.y); });
  const endDrag=()=>{ drag=null; sc.style.cursor=''; }; sc.addEventListener('pointerup', endDrag); sc.addEventListener('pointercancel', endDrag);
  sc.addEventListener('wheel', e=>{ if(!e.ctrlKey && !e.metaKey) return; e.preventDefault(); const r=sc.getBoundingClientRect(); vZoom(V.zoom*Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
  // 2本指で拡大・縮小（どの道具でも使える）
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  sc.addEventListener('touchstart', e=>{ if(e.touches.length===2){ if(V.drawing){ V.drawing=null; vMarks(); } V.pinch={d:dist(e.touches), z:V.zoom}; } }, {passive:true});
  sc.addEventListener('touchmove', e=>{ if(!V.pinch||e.touches.length!==2) return; e.preventDefault(); const r=sc.getBoundingClientRect();
    vZoom(V.pinch.z*dist(e.touches)/V.pinch.d, (e.touches[0].clientX+e.touches[1].clientX)/2-r.left, (e.touches[0].clientY+e.touches[1].clientY)/2-r.top); }, {passive:false});
  sc.addEventListener('touchend', e=>{ if(e.touches.length<2) setTimeout(()=>{ V.pinch=null; },50); });
}
document.addEventListener('keydown', e=>{ if(!V.id || e.target.matches('textarea,input')) return;
  if(e.key==='Escape') closeViewer(); else if(e.key==='ArrowRight'&&V.pages>1) vPage(V.page+1); else if(e.key==='ArrowLeft'&&V.pages>1) vPage(V.page-1); });

const appLink = (pid, tab) => MODE==='server' ? `${location.origin}${location.pathname}#p=${encodeURIComponent(pid)}${tab?'&t='+tab:''}` : '';

async function shareOfficeFile(coll, id){
  const x=officeColl(coll).find(v=>v.id===id), b=x&&await FileStore.get(x.fileKey);

  const f=new File([b], x.fileName||x.title||'file', {type:b.type||'application/octet-stream'});

    try{ await navigator.share({files:[f], title:x.title||x.fileName, text:officeLineText(coll,x)}); }
    catch(e){ if(e.name==='AbortError') return; toast('この画面では直接送れないので、保存してからLINEで添付してください'); await saveFile(b, f.name); }
  } else { toast('この画面では直接送れないので、保存してからLINEで添付してください'); await saveFile(b, f.name); }

/* ============ 引っ越し（全データ＋ファイルを1つのファイルに） ============
   お試し版→サーバー版、サーバーA→サーバーB のどちらも同じ形式で移せる。
   ドメインを変えるだけならデータは動かさなくてよい（server/ドメイン移行.md 参照）。 */
const canMove = () => MODE==='demo' || me().role==='gr_admin';
async function blobToB64(b){ const u=new Uint8Array(await b.arrayBuffer()); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBlob(b64,type){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
const Move = {
  keys(st){ return [...st.photos, ...st.docs, ...(st.internal||[]), ...(st.meetings||[]), ...(st.templates||[]), ...(st.sales||[])].map(x=>x.fileKey).filter(Boolean); },
  async pack(){
    const files={}; let miss=0;
    for(const k of new Set(this.keys(S))){ const b=await FileStore.get(k); if(!b){ miss++; continue; } files[k]={type:b.type||'application/octet-stream', b64:await blobToB64(b)}; }
    const data=JSON.parse(JSON.stringify(S)); delete data.userId;
    return {pack:{format:'reiwa-gr-hub-backup', version:1, exportedAt:nowISO(), from:MODE, data, files}, miss};
  },
  parse(text){
    const j=JSON.parse(text);
    const pack = j.format==='reiwa-gr-hub-backup' ? j : {format:'reiwa-gr-hub-backup',version:1,exportedAt:null,data:j,files:{}};   // 旧形式（データだけ）も受け付ける
    const d=pack.data; if(!d || !Array.isArray(d.projects)) throw new Error('形式が違います');
    for(const k of ['tasks','estimates','docs','photos','reports','notices','todos','corrections','approvals','messages','activity','changes','internal','pipeline','meetings','templates','sales','plans']) d[k]=Array.isArray(d[k])?d[k]:[];
    d.surveys=d.surveys||{}; d.inspections=d.inspections||{}; d.version=2;
    return pack;
  },
  // サーバーの保存場所は「案件番号/ファイル名」「gi:社内」の形に揃える（古いお試し版のキーを直す）
  normalizeKey(k, pid){ if(k.startsWith('gi:') || k.includes('/')) return k; return pid ? `${pid}/${k}` : 'gi:'+k; },
  async restore(pack){
    const d=pack.data, files=pack.files||{}, remap={};
    const fix=(x,pid)=>{ if(!x.fileKey) return; const nk=this.normalizeKey(x.fileKey,pid); remap[nk]=x.fileKey; x.fileKey=nk; };
    d.photos.forEach(x=>fix(x,x.pid)); d.docs.forEach(x=>fix(x,x.pid)); [...d.internal,...d.meetings,...d.templates,...d.sales].forEach(x=>{ if(x.fileKey&&!x.fileKey.startsWith('gi:')&&!x.fileKey.includes('/')) { remap['gi:'+x.fileKey]=x.fileKey; x.fileKey='gi:'+x.fileKey; } });
    const st=$('#moveStatus'); let i=0; const all=this.keys(d);
    if(MODE==='demo'){ await FileStore.clear(); urlCache.clear(); }
    for(const k of all){ const src=files[remap[k]||k]; if(!src) continue; await FileStore.put(k, b64ToBlob(src.b64, src.type)); i++; if(st) st.textContent=`ファイルを移しています… ${i} / ${all.length}`; }
    const keepUser=S.userId; S=d; S.userId=keepUser||'u_gr_admin';
    if(MODE==='server'){ clearTimeout(Sync.timer); Sync.timer=null; await Sync.flush(); await Sync.pull(); } else save();
    return i;
  }
};

/* ============ 状態アクセス ============ */

function log(pid, text){ S.activity.unshift({id:uid('l'),at:nowISO(),pid,text:`${text}`,by:myLabel()}); if(MODE==='demo') S.activity=S.activity.slice(0,300); }

/* ============ 要対応の自動抽出 ============ */
function attentionItems(){
  const ids=visibleIds(), today=todayISO(), out=[];
  S.approvals.filter(a=>ids.has(a.pid)&&['reiwa_wait','gr_check','need_answer'].includes(a.state)).forEach(a=>
    out.push({pid:a.pid,level:a.state==='need_answer'?'ng':'warn',text:`${a.kind}：${a.title}（${APPROVAL_STATE[a.state].label}）`,go:['approvals']}));
  S.corrections.filter(c=>ids.has(c.pid)&&c.state!=='done').forEach(c=>
    out.push({pid:c.pid,level:c.due<today?'ng':'warn',text:`是正：${c.item}（${c.place}）期限 ${md(c.due)}${c.due<today?' 期限超過':''}`,go:['project',c.pid,'check']}));
  (S.todos||[]).filter(t=>ids.has(t.pid)&&!t.done&&t.due&&t.due<today).forEach(t=>
    out.push({pid:t.pid,level:'ng',text:`タスク期限切れ：${t.title}（${t.assignee||'担当未定'}・${md(t.due)}）`,go:['project',t.pid,'todo']}));
  S.tasks.filter(t=>ids.has(t.pid)&&!t.done&&t.end<today).forEach(t=>
    out.push({pid:t.pid,level:'ng',text:`工程遅れ：${t.trade}（予定 ${md(t.end)} 終了）`,go:['project',t.pid,'schedule']}));
  Object.entries(S.surveys).filter(([pid])=>ids.has(pid)).forEach(([pid,s])=>{
    const w=s.items.filter(i=>i.state==='wait'||i.state==='ng'); if(w.length && ['survey','estimate'].includes((proj(pid)||{}).status))
      out.push({pid,level:'warn',text:`現調 未確定：${w.map(i=>i.title).join('・')}`,go:['survey',pid]});
  });
  if(me().role==='gr_admin') (S.pipeline||[]).filter(x=>['工事日調整済','着工中'].includes(x.status)&&!x.start).forEach(x=>
    out.push({pid:x.pid||'',title:x.name,level:'warn',text:`工事日 未入力：状態は「${x.status}」（案件進捗）`,go:['pipeline']}));
  if(me().role==='gr_admin') (S.sales||[]).filter(x=>x.type==='sale'&&x.status!=='入金済み'&&x.due&&x.due<today).forEach(x=>
    out.push({pid:'',title:x.party,level:'ng',text:`入金予定を過ぎています：${x.title||''} ${yen(x.amount)}（予定 ${md(x.due)}）`,go:['sales']}));
  return out;
}

const Office = {

    const arr=officeColl(coll); let x=id?arr.find(y=>y.id===id):null;
    if(!x){ x={id:uid('of'),at:nowISO(),by:myLabel(),fileKey:null,fileName:''}; arr.unshift(x); }
    Object.assign(x, v, {at:nowISO(), by:myLabel()});
    if(file&&file.size){ if(x.fileKey) FileStore.del(x.fileKey); const key='gi:'+uid('f'); await FileStore.put(key,file); x.fileKey=key; x.fileName=file.name; if(!x.title) x.title=file.name; }

/* --- 工程 --- */
function gantt(tasks, showProject, opt={}){
  if(!tasks.length) return '<div class="empty">工程がまだ登録されていません</div>';
  const today=todayISO();
  let start=tasks.reduce((m,t)=>t.start<m?t.start:m,tasks[0].start), end=tasks.reduce((m,t)=>t.end>m?t.end:m,tasks[0].end);
  start=addDays(start,-1); end=addDays(end,1);
  let n=daysBetween(start,end)+1; if(n>90){ n=90; }
  const days=[...Array(n)].map((_,i)=>addDays(start,i));
  const cols=`minmax(110px,160px) repeat(${n}, minmax(34px,1fr))`;
  let h=`<div class="gantt" style="grid-template-columns:${cols};min-width:${160+n*36}px"><div class="hd" style="text-align:left">${opt.head||'工種'}</div>`;
  h+=days.map(d=>{const w=new Date(d+'T00:00').getDay();return `<div class="hd ${d===today?'today':''} ${w===0||w===6?'we':''}">${md(d)}</div>`;}).join('');
  tasks.slice().sort((a,b)=>a.start.localeCompare(b.start)).forEach((t,i)=>{   // 行を明示しないと、名前が前の行のバーの後ろに詰められて列がずれる
    const s=Math.max(0,daysBetween(start,t.start)), e=Math.min(n-1,daysBetween(start,t.end));
    const cls=t.done?'done':t.end<today?'late':(t.start<=today&&today<=t.end?'active':'');
    const lbl=opt.label?esc(opt.label(t)):showProject?`${esc(pname(t.pid))}｜${esc(t.trade)}`:esc(t.trade), act=opt.act||'editTask';
    h+=`<div class="lbl" style="grid-column:1;grid-row:${i+2}" data-act="${act}" data-id="${t.id}" title="${lbl}">${lbl}</div>`;
    h+=`<div class="bar ${cls}" style="grid-column:${s+2}/${e+3};grid-row:${i+2}" data-act="${act}" data-id="${t.id}" title="${esc(t.trade)} ${md(t.start)}〜${md(t.end)}${t.done?'（完了）':''}">${t.done?'✓ ':''}${md(t.start)}〜${md(t.end)}</div>`;
  });
  return h+'</div>';
}

function inspectionBlock(pid){

    const x=ins[k];

    const ok=x.items.filter(i=>i.result==='ok').length, ng=x.items.filter(i=>i.result==='ng').length;
    return `<div class="card section" style="box-shadow:none"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${name}</h3>
      <div class="row"><label class="muted" for="insd_${k}" style="font-size:12px">検査日</label><input type="date" id="insd_${k}" data-insdate="${k}" data-pid="${pid}" value="${esc(x.date)}" ${can?'':'disabled'} style="border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--panel)"></div></div>
      <p class="muted" style="margin:6px 0 10px">${ok} / ${x.items.length} OK${ng?` ・ NG ${ng}件`:''}</p>
      <div class="checklist">${x.items.map((it,i)=>`<div class="check"><div class="title">${esc(it.name)}</div><div class="row">${['ok','ng'].map(r=>`<button class="pill ${it.result===r?(r==='ok'?'ok':'ng'):'todo'}" data-act="insSet" data-pid="${pid}" data-phase="${k}" data-i="${i}" data-r="${r}" ${can?'':'disabled'}>${lbl[r]}</button>`).join('')}</div></div>`).join('')}</div></div>`;
  };

function approvalCard(a, showProject=true){

      ${es.map(e=>`<tr><td>${esc(e.ver)}</td><td>${md(e.date)}</td><td class="money">${yen(e.amount)}</td><td class="money cost">${yen(e.cost)}</td><td class="cost">${e.amount?Math.round((1-e.cost/e.amount)*100)+'%':'—'}</td>
        <td>${can?`<select data-act="estState" data-id="${e.id}" aria-label="状態">${Object.entries(lbl).map(([k,v])=>`<option value="${k}" ${e.state===k?'selected':''}>${v[0]}</option>`).join('')}</select>`:`<span class="pill ${lbl[e.state][1]}">${lbl[e.state][0]}</span>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">見積はまだありません</td></tr>'}
      </tbody><tfoot><tr><th colspan="2">承認済み合計</th><th class="money">${yen(approved)}</th><th class="money cost">${yen(cost)}</th><th class="cost">${approved?Math.round((1-cost/approved)*100)+'%':'—'}</th><th></th></tr></tfoot></table></div>
      ${perm().cost?'':'<div class="perm-note">原価は表示権限がありません。</div>'}`;
  }
  case 'draw': return docsBlock(pid);
  case 'schedule': {
    const can=perm().schedule==='edit';
    return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">工程</h3>${can?`<button class="btn sm" data-act="newTask" data-pid="${pid}">＋ 工程を追加</button>`:''}</div>
      <div class="gantt-wrap">${gantt(S.tasks.filter(t=>t.pid===pid),false)}</div>${ganttLegend}`;
  }
  case 'photo': return photoBlock(pid);
  case 'check': return inspectionBlock(pid);
  case 'chat': return chatBlock(pid);
  case 'change': {
    const ch=S.changes.filter(c=>c.pid===pid); const ap=S.approvals.filter(a=>a.pid===pid);
    return `${ap.length?`<h3>承認・変更申請</h3>${ap.map(a=>approvalCard(a,false)).join('')}`:''}
      <h3 class="mt">変更履歴</h3><div class="tablewrap"><table><thead><tr><th>日時</th><th>変更</th><th>実行者</th></tr></thead><tbody>
      ${ch.map(c=>`<tr><td>${mdhm(c.at)}</td><td>${esc(c.text)}</td><td>${esc(c.by)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">変更履歴はありません</td></tr>'}</tbody></table></div>`;
  }
  }
  return '';
}

async function hydrateImages(){
  for(const img of document.querySelectorAll('img[data-key]')){ const u=await fileURL(img.dataset.key); if(u) img.src=u; else img.alt='画像を読み込めません'; }
}

/* ============ ドロワー・モーダル・トースト ============ */
function openDrawer(html){ const d=$('#drawer'); d.innerHTML=html; d.classList.add('open'); d.setAttribute('aria-hidden','false'); $('#overlay').hidden=false; const f=d.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),50); }
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); $('#overlay').hidden=true; }
function closeSidebar(){ $('#sidebar').classList.remove('open'); if(!$('#drawer').classList.contains('open')) $('#overlay').hidden=true; }
const drawerHead = t => `<div class="row" style="justify-content:space-between;margin-bottom:16px"><h2>${t}</h2><button class="btn" data-act="closeDrawer" aria-label="閉じる">×</button></div>`;
function confirmBox(text, okLabel, onOk){
  $('#modalRoot').innerHTML=`<div class="modal"><div class="box"><p style="margin-top:0">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">やめる</button><button class="btn primary" id="modalOk">${esc(okLabel)}</button></div></div></div>`;
  $('#modalOk').onclick=()=>{ $('#modalRoot').innerHTML=''; onOk(); };
}
let toastT; function toast(t){ let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }
const formData = form => Object.fromEntries(new FormData(form).entries());
const fld = (label,name,val='',type='text',extra='') => `<div class="field"><label for="fm_${name}">${label}</label><input id="fm_${name}" name="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`;
const sel = (label,name,opts,val) => `<div class="field"><label for="fm_${name}">${label}</label><select id="fm_${name}" name="${name}">${opts.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`:`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
const area = (label,name,val='',ph='') => `<div class="field"><label for="fm_${name}">${label}</label><textarea id="fm_${name}" name="${name}" placeholder="${esc(ph)}">${esc(val)}</textarea></div>`;

    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${fld('元請','client',p.client||'元請')}${fld('契約番号','contractNo',p.contractNo||'')}</div>
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${fld('案件管理ID','mgmtId',p.mgmtId||'')}${fld('着工日','start',p.start||'','date')}</div>
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${sel('エリア','area',['関東','関西','中部','その他'],p.area)}${sel('区分','type',['戸建','マンション','ビル'],p.type)}</div>

function taskForm(t, pid){
  const isNew=!t; t=t||{pid:pid||visibleProjects()[0]?.id,trade:'',start:todayISO(),end:addDays(todayISO(),2),done:false};
  const can=perm().schedule==='edit';
  openDrawer(`${drawerHead(isNew?'工程を追加':'工程')}<form data-form="task" data-id="${isNew?'':t.id}">
    ${sel('案件','pid',visibleProjects().map(p=>[p.id,p.name]),t.pid)}
    ${fld('工種','trade',t.trade,'text','required list="tradeList" placeholder="例：大工"')}<datalist id="tradeList">${['解体','大工','電気・設備','設備・電気','クロス','内装','器具付け・美装','完了検査','是正'].map(x=>`<option>${x}</option>`).join('')}</datalist>
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${fld('開始','start',t.start,'date','required')}${fld('終了','end',t.end,'date','required')}</div>
    <div class="field"><label><input type="checkbox" name="done" ${t.done?'checked':''}> 完了</label></div>
    ${can?`<button class="btn primary" style="width:100%" type="submit">保存</button>${isNew?'':`<button class="btn danger mt" style="width:100%" type="button" data-act="delTask" data-id="${t.id}">この工程を削除</button>`}`:'<div class="perm-note">閲覧のみの権限です。</div>'}</form>`);
  if(!can) $('#drawer').querySelectorAll('input,select').forEach(e=>e.disabled=true);
}

  if(el.tagName==='A') e.preventDefault();

  case 'nav': if(d.page==='docs') view.docsPid=''; go(d.page); break;
  case 'open': closeDrawer(); go('project', d.pid, d.tab); break;
  case 'tab': view.tab=d.tab; render(); break;

  case 'kpi': view.filters.status=d.status; go(d.status==='approve'?'approvals':'projects'); break;
  case 'newProject': projectForm(null); break;
  case 'editProject': projectForm(proj(d.pid)); break;
  case 'delProject': confirmBox(`「${pname(d.pid)}」と関連データ（工程・見積・資料・写真・チャット）を削除します。元に戻せません。`,'削除する',()=>{
      const pid=d.pid; S.photos.filter(x=>x.pid===pid).forEach(x=>FileStore.del(x.fileKey)); S.docs.filter(x=>x.pid===pid&&x.fileKey).forEach(x=>FileStore.del(x.fileKey));
      ['tasks','estimates','docs','photos','reports','notices','todos','corrections','approvals','messages','activity','changes'].forEach(k=>S[k]=S[k].filter(x=>x.pid!==pid));
      delete S.surveys[pid]; delete S.inspections[pid]; S.projects=S.projects.filter(p=>p.id!==pid); save(); closeDrawer(); toast('案件を削除しました'); go('projects'); }); break;
  case 'setStatus': { const p=proj(d.pid); if(p.status===d.s) break; change(p.id,`ステータス ${STATUS[p.status].label} → ${STATUS[d.s].label}`); log(p.id,`ステータス変更 / ${STATUS[d.s].label}`); p.status=d.s; if(d.s==='done') p.progress=100; save(); render(); toast(`ステータスを「${STATUS[d.s].label}」にしました`); break; }
  case 'svCycle': { const s=S.surveys[d.pid], it=s.items[+d.i]; const order=['todo','wait','ok','ng']; it.state=order[(order.indexOf(it.state)+1)%order.length]; if(s.items.every(i=>i.state==='ok')) log(d.pid,'現調完了 / 全項目チェック済み'); save(); render(); break; }
  case 'newTask': taskForm(null, d.pid); break;
  case 'editTask': taskForm(S.tasks.find(t=>t.id===d.id)); break;
  case 'delTask': { const t=S.tasks.find(x=>x.id===d.id); S.tasks=S.tasks.filter(x=>x.id!==d.id); change(t.pid,`工程削除：${t.trade}`); save(); closeDrawer(); render(); toast('工程を削除しました'); break; }
  case 'startInspection': { S.inspections[d.pid]=S.inspections[d.pid]||{}; S.inspections[d.pid][d.phase]={date:todayISO(),items:INSPECT_TEMPLATE[d.phase].map(n=>({name:n,result:'todo'}))}; log(d.pid,`${d.phase==='mid'?'中間':'完了'}検査 開始`); save(); render(); break; }
  case 'insSet': { const x=S.inspections[d.pid][d.phase], it=x.items[+d.i]; const prev=it.result; it.result = it.result===d.r?'todo':d.r;
      if(it.result==='ng' && prev!=='ng' && !S.corrections.some(c=>c.pid===d.pid&&c.item===it.name&&c.state!=='done')){
        S.corrections.push({id:uid('c'),pid:d.pid,item:it.name,place:'',owner:'',due:addDays(todayISO(),2),state:'todo'}); log(d.pid,`検査NG / ${it.name}（是正を登録）`); toast('NGのため是正項目を追加しました'); }
      if(x.items.every(i=>i.result==='ok')) log(d.pid,`${d.phase==='mid'?'中間':'完了'}検査 合格 / 全${x.items.length}項目OK`);
      save(); render(); break; }
  case 'newCorrection': openDrawer(`${drawerHead('是正を追加')}<form data-form="correction" data-pid="${d.pid}">${fld('項目','item','','text','required')}${fld('場所','place')}${fld('担当','owner')}${fld('期限','due',addDays(todayISO(),2),'date')}<button class="btn primary" style="width:100%" type="submit">追加</button></form>`); break;
  case 'corrCycle': { const c=S.corrections.find(x=>x.id===d.id); const o=['todo','doing','done']; c.state=o[(o.indexOf(c.state)+1)%3]; if(c.state==='done') log(c.pid,`是正完了 / ${c.item}`); save(); render(); break; }

  case 'newNote': openDrawer(`${drawerHead('社内メモ')}<form data-form="note">${sel('案件（任意）','pid',[['','（案件なし）'],...S.projects.map(p=>[p.id,p.name])],'')}${fld('件名','title','','text','required placeholder="例：元請と打ち合わせ 9/29"')}${area('内容','text','','決まったこと・次にやること・注意点')}<button class="btn primary" style="width:100%" type="submit">保存</button></form>`); break;
  case 'loadSample': { const sd=seed(); for(const k of Object.keys(sd)) if(!['version','userId'].includes(k)) S[k]=sd[k]; S.internal=S.internal||[]; save(); render(); toast('サンプル案件を入れました'); break; }

  case 'copyText': { const t=d.text; try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }catch(err){ toast('選択してコピーしてください'); } break; }
  case 'delDoc': confirmBox(`資料「${S.docs.find(x=>x.id===d.id).name}」を削除します。`,'削除する',()=>{ const doc=S.docs.find(x=>x.id===d.id); if(doc.fileKey) FileStore.del(doc.fileKey); S.docs=S.docs.filter(x=>x.id!==d.id); change(doc.pid,`資料削除：${doc.name}`); save(); render(); toast('削除しました'); }); break;

  case 'photoMode': view.photoMode=d.m; render(); break;
  case 'photoSelAll': S.photos.filter(x=>x.pid===d.pid&&photoFolder(x)===d.f).forEach(x=>view.photoSel.add(x.id)); render(); break;
  case 'photoSelNone': S.photos.filter(x=>x.pid===d.pid&&photoFolder(x)===d.f).forEach(x=>view.photoSel.delete(x.id)); render(); break;

  case 'newEstimate': openDrawer(`${drawerHead('見積を追加')}<form data-form="estimate" data-pid="${d.pid}">${fld('版','ver','v'+(S.estimates.filter(x=>x.pid===d.pid).length+1),'text','required')}${fld('金額（税込・円）','amount','','number','required min="0" step="1"')}${fld('原価（円）','cost','','number','min="0" step="1"')}<button class="btn primary" style="width:100%" type="submit">追加</button></form>`); break;
  case 'newApproval': { const ps=visibleProjects(); openDrawer(`${drawerHead('申請・依頼を作成')}<form data-form="approval">${sel('案件','pid',ps.map(p=>[p.id,p.name]),view.pid||ps[0]?.id)}${sel('種別','kind',APPROVAL_KIND,'追加工事')}${fld('件名','title','','text','required placeholder="例：壁内部ブロック撤去"')}${fld('金額（円・任意）','amount','','number','min="0" step="1"')}${area('内容','body','','理由・範囲・根拠資料など')}<button class="btn primary" style="width:100%" type="submit">申請する</button></form>`); break; }
  case 'apprFilter': view.apprFilter=d.f; render(); break;
  case 'apprDecide': { const ap=S.approvals.find(x=>x.id===d.id); const L={approved:'承認',rejected:'差戻し',reiwa_wait:'Rateru確認済み・元請へ',answered:'回答'};
      openDrawer(`${drawerHead(L[d.d])}<p class="muted" style="margin-top:0">${esc(ap.kind)}：${esc(ap.title)}</p><form data-form="decide" data-id="${ap.id}" data-d="${d.d}">${area(d.d==='answered'?'回答内容':'コメント（任意）','comment','',d.d==='rejected'?'差戻しの理由':'')}<button class="btn primary" style="width:100%" type="submit">${L[d.d]}する</button></form>`); break; }
  case 'export': { if(!canMove()) break; const st=$('#moveStatus'); if(st) st.textContent='書き出し中…（写真が多いと時間がかかります）';
      const {pack,miss}=await Move.pack(); const json=JSON.stringify(pack);
      try{ const u=URL.createObjectURL(new Blob([json],{type:'application/json'})); const aEl=document.createElement('a'); aEl.href=u; aEl.download=`reiwa-gr-hub-backup-${todayISO()}.json`; document.body.appendChild(aEl); aEl.click(); aEl.remove(); }catch(err){}
      if(st) st.textContent=`書き出しました：案件${pack.data.projects.length}件・ファイル${Object.keys(pack.files).length}件（${(json.length/1048576).toFixed(1)}MB）${miss?` ／ 見つからないファイル${miss}件`:''}`;
      break; }
  case 'reset': confirmBox('すべてのデータを消して、サンプルデータに戻します。元に戻せません。','サンプルに戻す',async()=>{ await FileStore.clear(); urlCache.clear(); S=seed(); save(); toast('サンプルデータに戻しました'); go('dashboard'); }); break;
  case 'closeDrawer': closeDrawer(); break;
  case 'lineApprove': await LineCfg.update(d.id,{approved:true}); $('#lineBox').innerHTML=LineCfg.html(); toast('LINE通知先を承認しました'); break;
  case 'lineDel': confirmBox('このLINE通知先を解除します。','解除する',()=>LineCfg.remove(d.id)); break;
  case 'lineTest': await LineCfg.test(d.id); break;
  case 'closeModal': if(e.target===el || el.tagName==='BUTTON') $('#modalRoot').innerHTML=''; break;
  }
});
document.addEventListener('change', async e=>{
  const el=e.target, d=el.dataset;
  if(el.id==='roleSel'){ S.userId=el.value; save(); toast(`${me().roleLabel}（${me().name}）として表示中`); if(view.page==='project'&&!visibleIds().has(view.pid)) view.page='projects'; render(); return; }
  if(d.filter){ view.filters[d.filter]=el.value; render(); return; }
  if(d.act==='pick'){ view[d.key]=el.value; render(); return; }
  if(d.act==='pipeFilter'){ Pipe.f[d.key]=el.type==='checkbox'?el.checked:el.value; render(); return; }
  if(d.sv){ S.surveys[d.pid][d.sv]=el.value; save(); return; }
  if(d.svnote!==undefined){ S.surveys[d.pid].items[+d.svnote].note=el.value; save(); return; }
  if(d.insdate){ S.inspections[d.pid][d.insdate].date=el.value; save(); return; }
  if(d.act==='progress'){ const p=proj(d.pid); p.progress=+el.value; save(); render(); return; }
  if(d.act==='estState'){ const x=S.estimates.find(v=>v.id===d.id); x.state=el.value; change(x.pid,`見積 ${x.ver} の状態を変更`); save(); render(); return; }
  if(d.act==='addPhoto'){
    const folder=d.folder||($('#ph_label')||{}).value||'現地調査'; const files=[...el.files]; if(!files.length) return;
    toast(`${files.length}枚を保存中…`);
    for(const f of files){ let b=await shrinkImage(f); const key=`${d.pid}/${uid('f')}`, shotAt=f.lastModified?new Date(f.lastModified).toISOString():nowISO(); let board=null;
      if(view.board && b.type.startsWith('image/')){ const rows=boardRows(d.pid, folder, shotAt, view.boardNote.trim()); b=await burnBoard(b, rows); board=Object.fromEntries(rows); }
      await FileStore.put(key,b);
      S.photos.push({id:uid('ph'),pid:d.pid,folder,label:folder,date:nowISO(),shotAt,fileKey:key,by:myLabel(),...(board?{board}:{})}); }
    log(d.pid,`写真登録 / ${folder} ${files.length}枚`); save(); render(); toast(`${files.length}枚を「${folder}」に登録しました`); return;
  }
  if(d.act==='todoDone'){ const t=S.todos.find(x=>x.id===d.id); t.done=el.checked; if(t.done) log(t.pid,`タスク完了 / ${t.title}`); save(); render(); return; }
  if(d.act==='boardOn'){ view.board=el.checked; try{ localStorage.setItem('hub-board', el.checked?'1':'0'); }catch(e){} render(); return; }
  if(d.act==='lineProj'){ await LineCfg.update(d.id,{project_id:el.value||null}); toast('対象の案件を変えました'); return; }
  if(d.act==='lineEv'){ const r=LineCfg.rows.find(x=>x.id===d.id); const ev=new Set(r.events||[]); el.checked?ev.add(d.ev):ev.delete(d.ev); await LineCfg.update(d.id,{events:[...ev]}); return; }
  if(d.act==='photoSel'){ el.checked?view.photoSel.add(d.id):view.photoSel.delete(d.id); render(); return; }
  if(d.act==='hideEmpty'){ view.hideEmpty=el.checked; render(); return; }
  if(d.act==='addDocs'){
    const files=[...el.files]; if(!files.length) return; const vis=($('#dc_vis')||{}).value||'all';
    toast(`${files.length}件を保存中…`);
    for(const f of files){ const key=vis==='gr'?'gi:'+uid('f'):`${d.pid}/${uid('f')}`; await FileStore.put(key,f);
      const ext=(f.name.includes('.')?f.name.split('.').pop():'FILE').toUpperCase();
      S.docs.push({id:uid('d'),pid:d.pid,name:f.name.replace(/\.[^.]+$/,''),type:ext,ver:1,updated:nowISO(),fileKey:key,fileName:f.name,history:[],folder:d.folder,visibility:vis}); }
    change(d.pid,`資料追加：${d.folder}に${files.length}件`); log(d.pid,`資料追加 / ${d.folder} ${files.length}件`); save(); render(); toast(`${files.length}件を「${d.folder}」に登録しました`); return;
  }
  if(d.act==='docVis'){
    const doc=S.docs.find(x=>x.id===d.id); const to=el.value; if((doc.visibility||'all')===to) return;
    if(doc.fileKey){ const b=await FileStore.get(doc.fileKey); if(b){ const nk=to==='gr'?'gi:'+uid('f'):`${doc.pid}/${uid('f')}`; await FileStore.put(nk,b); await FileStore.del(doc.fileKey); doc.fileKey=nk; } }
    doc.visibility=to; change(doc.pid,`資料「${doc.name}」を${to==='gr'?'Rateru社内のみ':'全員に公開'}に変更`); save(); render(); toast('公開範囲を変更しました'); return;
  }
  if(d.act==='docVersion'){
    const f=el.files[0]; if(!f) return; const doc=S.docs.find(x=>x.id===d.id);
    doc.history.push({ver:doc.ver,updated:doc.updated,fileName:doc.fileName,...(doc.marks&&doc.marks.length?{marks:doc.marks}:{})}); doc.marks=[]; if(doc.fileKey) FileStore.del(doc.fileKey);
    const key=doc.visibility==='gr'?'gi:'+uid('f'):`${doc.pid}/${uid('f')}`; await FileStore.put(key,f); doc.fileKey=key; doc.fileName=f.name; doc.ver++; doc.updated=nowISO(); doc.type=(f.name.split('.').pop()||doc.type).toUpperCase();
    change(doc.pid,`${doc.name} v${doc.ver-1} → v${doc.ver}（旧版は使用停止）`); log(doc.pid,`図面更新 / ${doc.name} v${doc.ver}`); save(); render(); toast(`${doc.name} を v${doc.ver} に更新しました`); return;
  }
  if(d.act==='officeFiles'){ const files=[...el.files]; if(!files.length) return; await Office.addFiles(d.coll, files, d.coll==='meetings'?{month:d.month}:{cat:d.cat}); return; }
  if(d.act==='internalFile'){
    const files=[...el.files]; if(!files.length) return; toast(`${files.length}件を保存中…`);
    for(const f of files){ const key='gi:'+uid('f'); await FileStore.put(key,f); S.internal.unshift({id:uid('in'),pid:'',kind:'file',title:f.name,text:'',fileKey:key,fileName:f.name,at:nowISO(),by:myLabel()}); }
    save(); render(); toast(`${files.length}件を社内フォルダに入れました`); return;
  }
  if(d.act==='memberRole'){
    const {error}=await SB.from('profiles').update({role:el.value,company:ROLE_COMPANY[el.value]}).eq('id',d.id);
    if(error) toast('変更できませんでした：'+error.message); else toast('役割を変更しました'); Members.load(); return;
  }
  if(d.act==='import'){
    const f=el.files[0]; if(!f || !canMove()) return; let pack;
    try{ pack=Move.parse(await f.text()); }catch(err){ toast('読み込めませんでした。このアプリで書き出した引っ越しデータを選んでください'); return; }
    confirmBox(`引っ越しデータ（案件${pack.data.projects.length}件・ファイル${Object.keys(pack.files).length}件、${mdhm(pack.exportedAt||nowISO())}書き出し）を読み込みます。今のデータはこの内容に置き換わります。`,'読み込む',async()=>{
      const st=$('#moveStatus'); if(st) st.textContent='読み込み中…';
      try{ const n=await Move.restore(pack); toast('引っ越しデータを読み込みました'); go('dashboard'); }
      catch(err){ toast('途中で失敗しました：'+(err.message||err)); if(st) st.textContent='失敗しました。もう一度お試しください。'; }
    });
  }
});
document.addEventListener('input', e=>{ const d=e.target.dataset; if(e.target.id==='ph_note'){ view.boardNote=e.target.value; return; } if(d.filter==='q'){ view.filters.q=e.target.value; render(); } if(e.target.id==='rp_q'){ Pipe.f.q=e.target.value; render(); } });
document.addEventListener('submit', async e=>{
  const f=e.target; e.preventDefault();
  if(f.dataset.act==='send'){ const i=f.querySelector('input'); const t=i.value.trim(); if(!t) return; const u=me(); S.messages.push({id:uid('m'),pid:f.dataset.pid,company:u.company,name:u.name,at:nowISO(),text:t}); save(); render(); const n=$('#chatInput'); if(n) n.focus(); return; }
  const v=formData(f), k=f.dataset.form;
  if(k==='login'){
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true;
    const {data,error}=await SB.auth.signInWithPassword({email:loginEmail(v.id),password:v.pw});
    if(error){ showLogin('ログインIDかパスワードが違います。'); return; }
    await afterLogin(data.user); return;
  }
  if(k==='todo'){ const pid=f.dataset.pid; S.todos.push({id:uid('td'),pid,title:v.title.trim(),assignee:v.assignee.trim(),due:v.due||'',done:false,by:myLabel(),at:nowISO()}); save(); render(); const n=$('#todoTitle'); if(n) n.focus(); toast('タスクを追加しました'); return; }
  if(k==='report'){
    S.reports.unshift({id:uid('r'),pid:v.pid,type:v.type||'日報',date:v.date,weather:v.weather,workers:v.workers.trim(),work:v.work.trim(),tomorrow:v.tomorrow.trim(),issues:v.issues.trim(),by:myLabel(),at:nowISO()});
    log(v.pid,`${v.type||'日報'} / ${v.date.slice(5).replace('-','/')} ${v.work.trim().slice(0,30)}`); save(); closeDrawer(); render(); toast('日報を登録しました'); return;
  }
  if(k==='notice'){ const t=v.text.trim(); if(!t) return; S.notices.unshift({id:uid('n'),pid:f.dataset.pid,text:t,at:nowISO(),by:myLabel()}); log(f.dataset.pid,`お知らせ / ${t.slice(0,30)}`); save(); render(); toast('お知らせを掲示しました'); return; }
  if(k==='pipe'){ Pipe.save(f.dataset.id, v); return; }
  if(k==='plan'){ Plan.save(f.dataset.id, v); return; }
  if(k==='office'){ await Office.submit(f, v); return; }
  if(k==='note'){ S.internal.unshift({id:uid('in'),pid:v.pid,kind:'note',title:v.title.trim(),text:v.text,fileKey:null,at:nowISO(),by:myLabel()}); save(); closeDrawer(); render(); toast('社内メモを保存しました'); return; }
  if(k==='newLogin'){
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true;
    const tmp=supabase.createClient(CFG().supabaseUrl, CFG().supabaseAnonKey, {auth:{persistSession:false,autoRefreshToken:false,storageKey:'hub-signup-tmp'}});
    const {data,error}=await tmp.auth.signUp({email:loginEmail(v.id),password:v.pw,options:{data:{display_name:v.name.trim()}}});
    if(error||!data.user||(data.user.identities&&!data.user.identities.length)){ btn.disabled=false; toast(error?('作成できませんでした：'+error.message):'このログインIDはすでに使われています'); return; }
    await SB.from('profiles').update({display_name:v.name.trim(),role:v.role,company:ROLE_COMPANY[v.role]}).eq('id',data.user.id);
    const text=`RateruPAD（施工管理）\nURL：${location.origin}\nログインID：${v.id}\nパスワード：${v.pw}`;
    openDrawer(`${drawerHead('ログインを作成しました')}<p>下の内容を相手に渡してください。パスワードはこの画面を閉じると再表示できません。</p><pre style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap">${esc(text)}</pre><button class="btn primary" style="width:100%" data-act="copyText" data-text="${esc(text)}">コピー</button>`);
    Members.load(); return;
  }
  if(k==='memberProjects'){
    const uidv=f.dataset.id, picked=[...f.querySelectorAll('input[name=p]:checked')].map(i=>i.value);
    const r1=await SB.from('project_members').delete().eq('user_id',uidv);
    const r2=picked.length?await SB.from('project_members').insert(picked.map(pid=>({project_id:pid,user_id:uidv}))):{error:null};
    if(r1.error||r2.error) toast('保存できませんでした'); else toast('担当案件を保存しました');
    closeDrawer(); Members.load(); return;
  }
  if(k==='project'){
    const data={name:v.name.trim(),address:v.address.trim(),client:(v.client||'').trim(),contractNo:(v.contractNo||'').trim(),mgmtId:(v.mgmtId||'').trim(),start:v.start||'',area:v.area,type:v.type,reiwaRep:v.reiwaRep.trim(),grRep:v.grRep.trim(),partners:v.partners.split(/[,、，]/).map(s=>s.trim()).filter(Boolean),due:v.due,next:v.next.trim(),note:v.note};
    if(f.dataset.pid){ const p=proj(f.dataset.pid); Object.assign(p,data); change(p.id,'案件情報を更新'); save(); closeDrawer(); render(); toast('保存しました'); }
    else { const id=nextProjectId(); S.projects.unshift({id,...data,status:'survey',progress:0,created:nowISO()}); log(id,'物件登録 / '+(me().company)+'より案件登録'); change(id,'案件登録'); save(); closeDrawer(); toast(`${data.name} を登録しました`); go('project',id); }
  }
  if(k==='task'){
    if(v.end<v.start){ toast('終了日は開始日以降にしてください'); return; }
    const data={pid:v.pid,trade:v.trade.trim(),start:v.start,end:v.end,done:!!v.done};
    if(f.dataset.id){ const t=S.tasks.find(x=>x.id===f.dataset.id); const moved=t.start!==data.start||t.end!==data.end; Object.assign(t,data); if(moved) change(t.pid,`工程変更：${t.trade} ${md(t.start)}〜${md(t.end)}`); if(data.done) log(t.pid,`工程完了 / ${t.trade}`); }
    else { S.tasks.push({id:uid('t'),...data}); change(data.pid,`工程追加：${data.trade} ${md(data.start)}〜${md(data.end)}`); }
    save(); closeDrawer(); render(); toast('工程を保存しました');
  }
  if(k==='correction'){ S.corrections.push({id:uid('c'),pid:f.dataset.pid,item:v.item.trim(),place:v.place.trim(),owner:v.owner.trim(),due:v.due,state:'todo'}); save(); closeDrawer(); render(); toast('是正項目を追加しました'); }
  if(k==='doc'){
    const file=f.querySelector('input[type=file]').files[0]; let key=null;
    if(file){ key=`${v.pid}/${uid('f')}`; await FileStore.put(key,file); }
    S.docs.push({id:uid('d'),pid:v.pid,name:v.name.trim(),type:file?(file.name.split('.').pop()||'FILE').toUpperCase():'—',ver:1,updated:nowISO(),fileKey:key,fileName:file?file.name:'',history:[]});
    change(v.pid,`資料追加：${v.name.trim()}`); log(v.pid,`資料追加 / ${v.name.trim()}`); save(); closeDrawer(); render(); toast('資料を登録しました');
  }
  if(k==='estimate'){ const pid=f.dataset.pid; S.estimates.push({id:uid('e'),pid,ver:v.ver.trim(),amount:+v.amount||0,cost:+v.cost||0,state:'draft',date:todayISO()}); log(pid,`見積更新 / ${v.ver}を作成`); change(pid,`見積 ${v.ver} 作成`); save(); closeDrawer(); render(); toast('見積を追加しました'); }
  if(k==='approval'){
    const u=me(); const state = v.kind==='設計確認' ? 'need_answer' : (u.company==='元請' ? 'gr_check' : 'reiwa_wait');
    S.approvals.unshift({id:uid('a'),pid:v.pid,kind:v.kind,title:v.title.trim(),body:v.body.trim(),amount:+v.amount||0,state,history:[{at:nowISO(),by:myLabel(),action:'申請',comment:''}]});
    if(v.kind==='追加工事' && +v.amount && perm().estimate==='edit') S.estimates.push({id:uid('e'),pid:v.pid,ver:'追加'+pad(S.estimates.filter(x=>x.pid===v.pid&&x.ver.startsWith('追加')).length+1),amount:+v.amount,cost:0,state:'wait',date:todayISO()});
    change(v.pid,`${v.kind}申請：${v.title.trim()}`); log(v.pid,`${v.kind}申請 / ${v.title.trim()}`); save(); closeDrawer(); view.apprFilter='open'; render(); toast('申請しました');
  }
  if(k==='decide'){
    const ap=S.approvals.find(x=>x.id===f.dataset.id), to=f.dataset.d;
    const L={approved:'承認',rejected:'差戻し',reiwa_wait:'Rateru確認済み',answered:'回答'};
    if(to==='answered' && !v.comment.trim()){ toast('回答内容を入力してください'); return; }
    ap.state=to; ap.history.push({at:nowISO(),by:myLabel(),action:L[to],comment:v.comment.trim()});
    if(ap.kind==='追加工事' && (to==='approved'||to==='rejected')){ const est=S.estimates.find(x=>x.pid===ap.pid&&x.state==='wait'&&x.amount===ap.amount); if(est) est.state=to==='approved'?'ok':'rejected'; }
    change(ap.pid,`${ap.kind}「${ap.title}」を${L[to]}`); log(ap.pid,`${L[to]} / ${ap.kind}：${ap.title}`); save(); closeDrawer(); render(); toast(`${L[to]}しました`);
  }
});

document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('rp-card')){ e.preventDefault(); Pipe.form(e.target.dataset.id); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); closeSidebar(); if(!document.querySelector('[data-form="login"]')) $('#modalRoot').innerHTML=''; } });

$('#logoutBtn').addEventListener('click',async()=>{ await SB.auth.signOut(); location.reload(); });
async function boot(){
  if(!CFG().supabaseUrl){ MODE='demo'; S=load(); S.internal=S.internal||[]; render(); openFromHash(); return; }
  MODE='server'; S=emptyState(); $('#app').hidden=true;
  try{ if(!window.supabase) await loadScript('supabase.js').catch(()=>loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js')); }
  catch(e){ document.body.insertAdjacentHTML('beforeend','<div class="modal"><div class="box">サーバーに接続するための部品を読み込めませんでした。通信状況を確認して再読み込みしてください。</div></div>'); return; }
  SB=supabase.createClient(CFG().supabaseUrl, CFG().supabaseAnonKey);
  const {data}=await SB.auth.getSession();
  if(data.session) await afterLogin(data.session.user); else showLogin();
}
boot();
</script>
</body></html>
