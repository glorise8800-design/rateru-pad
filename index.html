function pProject(){
  const p=proj(view.pid);
  if(!p || !visibleIds().has(p.id)) return `<div class="card section empty">この案件は表示できません。<br><button class="btn mt" data-act="nav" data-page="projects">案件一覧へ</button></div>`;
  const tabs=[['overview','概要'],['schedule','工程'],['photo','写真'],['draw','資料'],['report','報告'],['todo','タスク'],['member','メンバー'],['chat','チャット'],['check','検査'],['survey','現調'],['estimate','見積'],['change','変更履歴']]
    .filter(([k])=>!(k==='estimate'&&perm().estimate==='none'));
  if(!tabs.some(t=>t[0]===view.tab)) view.tab='overview';
  const canEdit=perm().createProject;
  return `<div class="card project-header"><div class="project-top">
    <div><small>${esc(p.client||'元請')} ・ ${p.id}</small><h2 style="margin:4px 0 0">${esc(p.name)} <button class="star" data-act="fav" data-pid="${p.id}" aria-label="お気に入り" title="お気に入り">${Favs.get().has(p.id)?'★':'☆'}</button></h2></div>
    <div class="row">${statusBadge(p.status)}${lineBtn(projectLineText(p))}${canEdit?`<button class="btn sm" data-act="editProject" data-pid="${p.id}">編集</button>`:''}</div></div>
    <div class="meta"><span>${esc(p.address)}</span><span>${esc(p.type)}</span><span>元請担当：${esc(p.reiwaRep||'—')}</span><span>Rateru担当：${esc(p.grRep)}</span>${(p.partners||[]).length?`<span>協力：${esc(p.partners.join('・'))}</span>`:''}<span>完工予定：${esc(p.due||'—')}</span></div>
    ${canEdit?`<div class="row mt"><span class="muted" style="font-size:12px">ステータス</span>${STATUS_ORDER.map(s=>`<button class="btn sm ${p.status===s?'primary':''}" data-act="setStatus" data-pid="${p.id}" data-s="${s}">${STATUS[s].label}</button>`).join('')}</div>`:''}
  </div>
  <div class="card"><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${view.tab===k?'active':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div>
  <div class="tabcontent">${projectTab(p)}</div></div>`;
}
function projectTab(p){
  const pid=p.id;
  switch(view.tab){
  case 'overview': {
    const att=attentionItems().filter(a=>a.pid===pid);
    const acts=S.activity.filter(a=>a.pid===pid).slice(0,8);
    const ns=S.notices.filter(n=>n.pid===pid).slice(0,5), canNotice=perm().createProject;
    const si=STATUS_ORDER.indexOf(p.status);
    const kv=[['システムID',p.id],['元請',p.client||'元請'],['元請担当',p.reiwaRep||'—'],['元請の電話',p.clientPhone?`${p.clientPhoneType==='office'?'会社電話':'携帯'}：${p.clientPhone}`:'—'],['顧客名',p.customerName||'—'],['顧客担当名',p.customerContact||'—'],['顧客電話番号',p.customerPhone||'—'],['契約番号',p.contractNo||'—'],['案件管理ID',p.mgmtId||'—'],['案件名',p.name],['住所',p.address||'—'],['区分',p.type],['工期',`${p.start?p.start.replace(/-/g,'/'):'—'} 〜 ${p.due?p.due.replace(/-/g,'/'):'—'}`]];
    return `<div class="grid2"><div>
      <h3>お知らせ</h3>
      ${ns.map(n=>`<div class="alert" style="cursor:default"><b>${esc(n.text)}</b><br><small>${mdhm(n.at)} ・ ${esc(n.by)}</small></div>`).join('')||'<p class="muted">未だ、お知らせはありません。</p>'}
      ${canNotice?`<form class="compose" data-form="notice" data-pid="${pid}" style="margin:0 0 16px"><input id="noticeInput" name="text" placeholder="案件メンバーへのお知らせ" autocomplete="off" required><button class="btn" type="submit">掲示</button></form>`:''}
      <h3>現在地</h3>
      <div class="alert" style="cursor:default"><b>${STATUS[p.status].label} ${p.progress}%</b><br>次の重要イベント：${esc(p.next||'—')}</div>
      <div class="row" style="margin-bottom:14px">${progressBar(p.progress)}${perm().createProject?`<input type="range" min="0" max="100" step="1" value="${p.progress}" data-act="progress" data-pid="${pid}" aria-label="進捗" style="flex:1;min-width:120px">`:''}</div>
      <h3>次に必要なこと</h3>
      <div class="checklist">${att.map(a=>`<div class="check"><div><div class="title">${esc(a.text.split('：')[0])}</div><div class="desc">${esc(a.text.split('：').slice(1).join('：'))}</div></div><span class="pill ${a.level==='ng'?'ng':'wait'}">要対応</span></div>`).join('')||'<div class="muted">要対応の項目はありません</div>'}</div>
      ${p.note?`<h3 class="mt">備考</h3><p style="white-space:pre-wrap">${esc(p.note)}</p>`:''}</div>
      <div><h3>詳細情報</h3><div class="kv">${kv.map(([k,v])=>`<div>${k}</div><div>${esc(v)}</div>`).join('')}</div>
      <h3>案件フロー</h3><div class="flow" style="margin-bottom:16px">${STATUS_ORDER.map((st,i)=>`<span class="${i===si?'on':i<si?'past':''}">${STATUS[st].label}</span>`).join('')}</div>
      <h3>最近の動き</h3><div class="timeline">${acts.map(a=>`<div class="tl"><div class="dot"></div><div><b>${mdhm(a.at)} ${esc(a.text.split(' / ')[0])}</b><small>${esc(a.text.split(' / ').slice(1).join(' / '))}${a.by?' ・ '+esc(a.by):''}</small></div></div>`).join('')||'<div class="muted">まだ記録がありません</div>'}</div></div></div>`;
  }
  case 'todo': {
    const ts=(S.todos||[]).filter(t=>t.pid===pid).sort((a,b)=>(a.done-b.done)||((a.due||'9')).localeCompare(b.due||'9'));
    const today=todayISO();
    return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">タスク（未完了 ${ts.filter(t=>!t.done).length}件）</h3></div>
      <form class="compose" data-form="todo" data-pid="${pid}" style="margin:0 0 12px;flex-wrap:wrap"><input id="todoTitle" name="title" placeholder="やること（例：建具の納期確認）" required autocomplete="off" style="flex:2;min-width:180px"><input name="assignee" placeholder="担当" aria-label="担当" style="flex:1;min-width:90px"><input name="due" type="date" aria-label="期限" style="flex:0 0 auto"><button class="btn primary" type="submit">追加</button></form>
      ${ts.map(t=>`<div class="todo ${t.done?'done':''}"><input type="checkbox" data-act="todoDone" data-id="${t.id}" ${t.done?'checked':''} aria-label="完了"><div class="t"><b>${esc(t.title)}</b><br><small>${esc(t.assignee||'担当未定')} ・ 期限 <span ${!t.done&&t.due&&t.due<today?'style="color:var(--ng);font-weight:700"':''}>${t.due?md(t.due):'—'}</span> ・ ${esc(t.by)}</small></div><button class="btn sm" data-act="delTodo" data-id="${t.id}" aria-label="削除">×</button></div>`).join('')||'<div class="empty">タスクはありません</div>'}`;
  }
  case 'report': return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">報告・日報</h3>${canReport()?`<button class="btn sm primary" data-act="newReport" data-pid="${pid}">＋ 日報を書く</button>`:''}</div>${reportCards(S.reports.filter(r=>r.pid===pid).sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at)),false)}`;
  case 'member': {
    const rows=[['元請',p.reiwaRep,'担当'], ...p.grRep.split('/').map(n=>n.trim()).filter(Boolean).map(n=>['Rateru',n,'施工管理']), ...(p.partners||[]).map(n=>['協力会社',n,'現場'])];
    return `<h3>案件メンバー（${rows.length}名）</h3><div class="tablewrap"><table><thead><tr><th>会社</th><th>名前</th><th>役割</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r[0])}</td><td><b>${esc(r[1]||'—')}</b></td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
      <div class="perm-note">${perm().createProject?'メンバーは「編集」から変更できます。':''}${MODE==='server'?' ログインの発行と、担当案件の割り当ては「設定・権限 → メンバー管理」で行います。':''}</div>`;
  }
  case 'survey': return surveyBlock(pid);
  case 'estimate': {
    const es=S.estimates.filter(e=>e.pid===pid); const can=perm().estimate==='edit';
    const lbl={draft:['下書き','todo'],wait:['承認待ち','wait'],ok:['承認済','ok'],rejected:['差戻し','ng']};
    const approved=es.filter(e=>e.state==='ok').reduce((s,e)=>s+e.amount,0), cost=es.filter(e=>e.state==='ok').reduce((s,e)=>s+(e.cost||0),0);
    return `<div class="row" style="justify-content:space-between"><h3 style="margin:0">見積・予算</h3>${can?`<button class="btn sm" data-act="newEstimate" data-pid="${pid}">＋ 見積を追加</button>`:''}</div>
      <div class="tablewrap mt"><table><thead><tr><th>版</th><th>日付</th><th>金額</th><th class="cost">原価</th><th class="cost">粗利率</th><th>状態</th></tr></thead><tbody>
      ${es.map(e=>`<tr><td>${esc(e.ver)}</td><td>${md(e.date)}</td><td class="money">${yen(e.amount)}</td><td class="money cost">${yen(e.cost)}</td><td class="cost">${e.amount?Math.round((1-e.cost/e.amount)*100)+'%':'—'}</td>
        <td>${can?`<select data-act="estState" data-id="${e.id}" aria-label="状態">${Object.entries(lbl).map(([k,v])=>`<option value="${k}" ${e.state===k?'selected':''}>${v[0]}</option>`).join('')}</select>`:`<span class="pill ${lbl[e.state][1]}">${lbl[e.state][0]}</span>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">見積はまだありません</td></tr>'}
      </tbody><tfoot><tr><th colspan="2">承認済み合計</th><th class="money">${yen(approved)}</th><th class="money cost">${yen(cost)}</th><th class="cost">${approved?Math.round((1-cost/approved)*100)+'%':'—'}</th><th></th></tr></tfoot></table></div>
      ${perm().cost?'':'<div class="perm-note">原価は表示権限がありません。</div>'}`;
  }
  case 'draw': return docsBlock(pid);
  case 'schedule': {
    const can=perm().schedule==='edit';
    return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">工程</h3><div class="row"><button class="btn sm" data-act="printSchedule" data-pid="${pid}">印刷・PDF保存</button>${can?`<button class="btn sm" data-act="newTask" data-pid="${pid}">＋ 工程を追加</button>`:''}</div></div>
      <div class="gantt-wrap">${gantt(S.tasks.filter(t=>t.pid===pid),false)}</div>${ganttLegend}`;
  }
  case 'photo': return photoBlock(pid);
  case 'check': return inspectionBlock(pid);
  case 'chat': return chatBlock(pid);
  case 'change': {
    const ch=S.changes.filter(c=>c.pid===pid); const ap=S.approvals.filter(a=>a.pid===pid);
    return `${ap.length?`<h3>承認・変更申請</h3>${ap.map(a=>approvalCard(a,false)).join('')}`:''}
      <h3 class="mt">変更履歴</h3><div class="tablewrap"><table><thead><tr><th>日時</th><th>変更</th><th>実行者</th></tr></thead><tbody>
      ${ch.map(c=>`<tr><td>${mdhm(c.at)}</td><td>${esc(c.text)}</td><td>${esc(c.by)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">変更履歴はありません</td></tr>'}</tbody></table></div>`;
  }
  }
  return '';
}

async function hydrateImages(){
  for(const img of document.querySelectorAll('img[data-key]')){ const u=await fileURL(img.dataset.key); if(u) img.src=u; else img.alt='画像を読み込めません'; }
}

/* ============ ドロワー・モーダル・トースト ============ */
function openDrawer(html){ const d=$('#drawer'); d.innerHTML=html; d.classList.add('open'); d.setAttribute('aria-hidden','false'); $('#overlay').hidden=false; const f=d.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),50); }
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); d.innerHTML=''; $('#overlay').hidden=true; }
function closeSidebar(){ $('#sidebar').classList.remove('open'); if(!$('#drawer').classList.contains('open')) $('#overlay').hidden=true; }
const drawerHead = t => `<div class="row" style="justify-content:space-between;margin-bottom:16px"><h2>${t}</h2><button class="btn" data-act="closeDrawer" aria-label="閉じる">×</button></div>`;
function confirmBox(text, okLabel, onOk){
  $('#modalRoot').innerHTML=`<div class="modal"><div class="box"><p style="margin-top:0">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">やめる</button><button class="btn primary" id="modalOk">${esc(okLabel)}</button></div></div></div>`;
  $('#modalOk').onclick=()=>{ $('#modalRoot').innerHTML=''; onOk(); };
}
let toastT; function toast(t){ let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }
const formData = form => Object.fromEntries(new FormData(form).entries());
const fld = (label,name,val='',type='text',extra='') => `<div class="field"><label for="fm_${name}">${label}</label><input id="fm_${name}" name="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`;
const sel = (label,name,opts,val) => `<div class="field"><label for="fm_${name}">${label}</label><select id="fm_${name}" name="${name}">${opts.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`:`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
const area = (label,name,val='',ph='') => `<div class="field"><label for="fm_${name}">${label}</label><textarea id="fm_${name}" name="${name}" placeholder="${esc(ph)}">${esc(val)}</textarea></div>`;

function projectForm(p){
  const isNew=!p; p=p||{name:'',address:'',area:'関東',type:'戸建',reiwaRep:'',grRep:me().role==='gr_admin'?me().name:'',partners:[],due:'',next:'',note:''};
  const numbers=nextProjectNumbers(isNew?nextProjectId():p.id);
  const clients=[...new Set([...S.projects.map(x=>x.client),p.client].map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const choice=clients.includes(p.client)?p.client:'';
  openDrawer(`${drawerHead(isNew?'新規案件登録':'案件を編集')}<form data-form="project" data-pid="${isNew?'':p.id}">
    ${fld('物件名','name',p.name,'text','required placeholder="例：世田谷 戸建A"')}
    ${fld('住所','address',p.address,'text','placeholder="都道府県・市区町村"')}
    ${sel('元請一覧から選択','clientChoice',[['','新しい元請を入力'],...clients.map(x=>[x,x])],choice)}
    <div id="newClientField" ${choice?'hidden':''}>${fld('新しい元請名','clientNew',choice?'':p.client||'')}</div>
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${fld('契約番号（自動）','contractNo',p.contractNo||numbers.contractNo,'text','readonly')}${fld('案件管理ID（自動）','mgmtId',p.mgmtId||numbers.mgmtId,'text','readonly')}</div>
    ${fld('顧客名','customerName',p.customerName||'')}
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${fld('顧客担当名','customerContact',p.customerContact||'')}${fld('顧客電話番号','customerPhone',p.customerPhone||'','tel')}</div>
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${sel('元請の電話種別','clientPhoneType',[['mobile','携帯'],['office','会社電話']],p.clientPhoneType||'mobile')}${fld('元請の電話番号','clientPhone',p.clientPhone||'','tel')}</div>
    ${fld('着工日','start',p.start||'','date')}
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${sel('エリア','area',['関東','関西','中部','その他'],p.area)}${sel('区分','type',['戸建','マンション','ビル'],p.type)}</div>
    ${fld('元請担当','reiwaRep',p.reiwaRep,'text','placeholder="担当者名"')}
    ${fld('Rateru担当（必須）','grRep',p.grRep,'text','required placeholder="担当者を記入"')}
    ${fld('協力会社（カンマ区切り）','partners',(p.partners||[]).join(', '),'text','placeholder="例：協力監督A"')}
    ${fld('完工予定','due',p.due,'date')}
    ${fld('次アクション','next',p.next,'text','placeholder="例：現調日程の確定"')}
    ${area('備考','note',p.note,'購入時点の条件・希望・注意事項')}
    <button class="btn primary" style="width:100%" type="submit">${isNew?'案件を登録':'保存'}</button>
    ${isNew?'':`<button class="btn danger mt" style="width:100%" type="button" data-act="delProject" data-pid="${p.id}">この案件を削除</button>`}</form>`);
}
function taskForm(t, pid){
  const isNew=!t; t=t||{pid:pid||visibleProjects()[0]?.id,trade:'',start:todayISO(),end:addDays(todayISO(),2),done:false};
  const can=perm().schedule==='edit';
  openDrawer(`${drawerHead(isNew?'工程を追加':'工程')}<form data-form="task" data-id="${isNew?'':t.id}">
    ${sel('案件','pid',visibleProjects().map(p=>[p.id,p.name]),t.pid)}
    ${fld('工種','trade',t.trade,'text','required list="tradeList" placeholder="例：大工"')}<datalist id="tradeList">${['解体','大工','電気・設備','設備・電気','クロス','内装','器具付け・美装','完了検査','是正'].map(x=>`<option>${x}</option>`).join('')}</datalist>
    <div class="formgrid" style="grid-template-columns:1fr 1fr;gap:10px">${fld('開始','start',t.start,'date','required')}${fld('終了','end',t.end,'date','required')}</div>
    <div class="field"><label><input type="checkbox" name="done" ${t.done?'checked':''}> 完了</label></div>
    ${can?`<button class="btn primary" style="width:100%" type="submit">保存</button>${isNew?'':`<button class="btn danger mt" style="width:100%" type="button" data-act="delTask" data-id="${t.id}">この工程を削除</button>`}`:'<div class="perm-note">閲覧のみの権限です。</div>'}</form>`);
  if(!can) $('#drawer').querySelectorAll('input,select').forEach(e=>e.disabled=true);
}

/* ============ イベント ============ */
document.addEventListener('click', async e=>{
  if(e.target.closest('a.ext')) return;   // 外のリンク（Dropboxなど）はそのまま開く
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  if(el.tagName==='SELECT'||el.tagName==='FORM'||(el.tagName==='INPUT'&&el.type!=='button')) return;
  if(el.tagName==='A') e.preventDefault();
  switch(a){
  case 'back': goBack(); break;
  case 'nav': if(d.page==='docs') view.docsPid=''; go(d.page); break;
  case 'open': closeDrawer(); go('project', d.pid, d.tab); break;
  case 'tab': if(view.tab!==d.tab) navTrail.push(routeNow()); view.tab=d.tab; render(); break;
  case 'goto': { const g=JSON.parse(d.go); go(g[0],g[1],g[2]); break; }
  case 'kpi': view.filters.status=d.status; go(d.status==='approve'?'approvals':'projects'); break;
  case 'newProject': projectForm(null); break;
  case 'editProject': projectForm(proj(d.pid)); break;
  case 'delProject': confirmBox(`「${pname(d.pid)}」と関連データ（工程・見積・資料・写真・チャット）を削除します。元に戻せません。`,'削除する',()=>{
      const pid=d.pid; S.photos.filter(x=>x.pid===pid).forEach(x=>FileStore.del(x.fileKey)); S.docs.filter(x=>x.pid===pid&&x.fileKey).forEach(x=>FileStore.del(x.fileKey));
      ['tasks','estimates','docs','photos','reports','notices','todos','corrections','approvals','messages','activity','changes'].forEach(k=>S[k]=S[k].filter(x=>x.pid!==pid));
      delete S.surveys[pid]; delete S.inspections[pid]; S.projects=S.projects.filter(p=>p.id!==pid); save(); closeDrawer(); toast('案件を削除しました'); go('projects'); }); break;
  case 'setStatus': { const p=proj(d.pid); if(p.status===d.s) break; if(!String(p.grRep||'').trim()){ toast('先に案件のRateru担当を記入してください'); projectForm(p); break; } change(p.id,`ステータス ${STATUS[p.status].label} → ${STATUS[d.s].label}`); log(p.id,`ステータス変更 / ${STATUS[d.s].label}`); p.status=d.s; if(d.s==='done') p.progress=100; save(); render(); toast(`ステータスを「${STATUS[d.s].label}」にしました`); break; }
  case 'svCycle': { const s=S.surveys[d.pid], it=s.items[+d.i]; const order=['todo','wait','ok','ng']; it.state=order[(order.indexOf(it.state)+1)%order.length]; if(s.items.every(i=>i.state==='ok')) log(d.pid,'現調完了 / 全項目チェック済み'); save(); render(); break; }
  case 'newTask': taskForm(null, d.pid); break;
  case 'editTask': taskForm(S.tasks.find(t=>t.id===d.id)); break;
  case 'delTask': { const t=S.tasks.find(x=>x.id===d.id); S.tasks=S.tasks.filter(x=>x.id!==d.id); change(t.pid,`工程削除：${t.trade}`); save(); closeDrawer(); render(); toast('工程を削除しました'); break; }
  case 'startInspection': { S.inspections[d.pid]=S.inspections[d.pid]||{}; S.inspections[d.pid][d.phase]={date:todayISO(),items:INSPECT_TEMPLATE[d.phase].map(n=>({name:n,result:'todo'}))}; log(d.pid,`${d.phase==='mid'?'中間':'完了'}検査 開始`); save(); render(); break; }
  case 'insSet': { const x=S.inspections[d.pid][d.phase], it=x.items[+d.i]; const prev=it.result; it.result = it.result===d.r?'todo':d.r;

});
$('#overlay').addEventListener('click',()=>{ closeDrawer(); closeSidebar(); });
$('#menuBtn').addEventListener('click',()=>{ $('#sidebar').classList.add('open'); $('#overlay').hidden=false; });
$('#newProjectBtn').addEventListener('click',()=>projectForm(null));
$('#bellBtn').addEventListener('click',()=>go('dashboard'));
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('rp-card')){ e.preventDefault(); Pipe.form(e.target.dataset.id); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); closeSidebar(); if(!document.querySelector('[data-form="login"]')) $('#modalRoot').innerHTML=''; } });

$('#logoutBtn').addEventListener('click',async()=>{ await SB.auth.signOut(); location.reload(); });
async function boot(){
  if(!CFG().supabaseUrl){ MODE='demo'; S=load();
    if(loadIssue){ $('#app').hidden=true; $('#modalRoot').innerHTML=`<div class="modal"><div class="box"><h2>保存データを保護しました</h2><p>${esc(loadIssue)}</p><p>この画面では新しい内容を保存しません。元のデータを控えてから確認してください。</p><button class="btn primary" id="rawDataExport">元データを書き出す</button></div></div>`;
      $('#rawDataExport').onclick=()=>{ const raw=localStorage.getItem(STORE_KEY); if(raw) saveFile(new Blob([raw],{type:'application/json'}),`rateru-pad-original-${todayISO()}.json`); }; return; }
    S.internal=S.internal||[]; render(); openFromHash(); Big.init().then(()=>Start.run());
    try{ const prior=localStorage.getItem(RELEASE_KEY);
      if(prior!==APP_RELEASE){ const raw=localStorage.getItem(STORE_KEY); if(raw){ try{ localStorage.setItem(STORE_KEY+'-backup',raw); }catch(e){ toast('更新前の控えを保存できませんでした。設定から引っ越しデータを書き出してください'); } } }
      localStorage.setItem(RELEASE_KEY,APP_RELEASE); if(prior&&prior!==APP_RELEASE&&NoticePrefs.get().app) NoticePrefs.show('RateruPADを更新しました','入力済みデータはこの端末に残ります'); }catch(e){}
    return; }
  MODE='server'; S=emptyState(); $('#app').hidden=true;
  try{ if(!window.supabase) await loadScript('supabase.js').catch(()=>loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js')); }
  catch(e){ document.body.insertAdjacentHTML('beforeend','<div class="modal"><div class="box">サーバーに接続するための部品を読み込めませんでした。通信状況を確認して再読み込みしてください。</div></div>'); return; }
  SB=supabase.createClient(CFG().supabaseUrl, CFG().supabaseAnonKey);
  const {data}=await SB.auth.getSession();
  if(data.session) await afterLogin(data.session.user); else showLogin();
}
window.addEventListener('storage',e=>{ if(MODE!=='demo'||e.key!==STORE_KEY||!e.newValue||loadIssue) return;
  const oldCases=JSON.stringify(S.projects||[]), oldPlans=JSON.stringify(S.plans||[]);
  const next=load(); if(loadIssue) return; S=next; render();
  const changed=oldCases!==JSON.stringify(S.projects||[])||oldPlans!==JSON.stringify(S.plans||[]);
  if(changed&&NoticePrefs.get().changes) NoticePrefs.show('RateruPADの内容が更新されました','案件または予定の変更を反映しました');
});
boot();
</script>
</body></html>
